function MiniElevation({ space, calc }) {
  const { modules } = calc;
  const svgW = 500;
  const marginX = 14, rightPad = 46, marginTop = 10;
  const usableW = svgW - marginX - rightPad;
  const maxCabinetH = 120;
  const scale = Math.min(usableW / space.width, maxCabinetH / 240);
  const cabinetH = scale * 240;
  const drawnWidth = scale * space.width;
  const originX = marginX + (usableW - drawnWidth) / 2;
  const svgH = marginTop + cabinetH + 22;
  let cursor = 0;

  return (
    <svg width="100%" viewBox={`0 0 ${svgW} ${svgH}`} style={{ display: "block", background: "#fdfcf8", borderRadius: 8 }}>
      {modules.map((m, i) => {
        const x = originX + cursor * scale;
        const w = m.width * scale;
        cursor += m.width;
        const { valance: valanceCm, kick: kickCm } = zoneCm(m.category);
        const valanceH = Math.min(cabinetH * 0.32, valanceCm * scale);
        const kickH = Math.min(cabinetH * 0.1, kickCm * scale);
        const interiorY = marginTop + valanceH + 2;
        const interiorH = cabinetH - valanceH - kickH - 4;
        const drawerHeights = resolveDrawerHeights(space, i, m.category);
        const basketHeights = resolveBasketHeights(space, i, m.category);
        return (
          <g key={i}>
            <rect x={x} y={marginTop} width={w - 1.5} height={cabinetH} fill="#fff" stroke={NAVY} strokeWidth={1} rx={1.5} />
            <rect x={x + 3} y={marginTop + 2} width={Math.max(w - 8, 1)} height={Math.max(valanceH - 3, 1)} fill="#f2ede0" stroke={NAVY} strokeWidth={0.6} />
            {drawInterior(m.category, x + 2, interiorY, w - 6, interiorH, NAVY, scale, drawerHeights, null, basketHeights, null)}
            <rect x={x} y={marginTop + cabinetH - kickH} width={w - 1.5} height={kickH} fill="#e9e3d2" />
          </g>
        );
      })}
      <text x={originX + drawnWidth / 2} y={marginTop + cabinetH + 15} textAnchor="middle" fontSize={9} fill="#8a8f9c">{space.width}cm</text>
    </svg>
  );
}

// shared bbox/viewBox setup for the room-outline plan drawings below
function roomPlanGeometry(polygon, scaleCmPerPx) {
  const cmPoints = polygon.map((p) => ({ x: p.x * scaleCmPerPx, y: p.y * scaleCmPerPx }));
  const xs = cmPoints.map((p) => p.x), ys = cmPoints.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 30;
  const vbW = maxX - minX + pad * 2, vbH = maxY - minY + pad * 2;
  const offX = -minX + pad, offY = -minY + pad;
  const toSvg = (p) => ({ x: p.x + offX, y: p.y + offY });
  const outlinePts = cmPoints.map((p) => `${p.x + offX},${p.y + offY}`).join(" ");
  const cx = (maxX - minX) / 2 + offX, cy = (maxY - minY) / 2 + offY;
  return { vbW, vbH, offX, offY, outlinePts, cx, cy, toSvg };
}

function polygonCentroid(points) {
  return points.reduce((s, p) => ({ x: s.x + p.x / points.length, y: s.y + p.y / points.length }), { x: 0, y: 0 });
}

// Snap a cabinet-footprint rectangle's corners to the nearest vertex of the room's own traced
// outline (the wall corners the user already identified) — simpler and more reliable than
// re-analysing pixels, since we already have exact points for the walls.
function snapRectToPolygonCorners(rectX, rectY, rectW, rectH, polygon, thresholdPx) {
  if (!polygon || polygon.length === 0) return { x: rectX, y: rectY };
  const corners = [
    { x: rectX, y: rectY }, { x: rectX + rectW, y: rectY },
    { x: rectX, y: rectY + rectH }, { x: rectX + rectW, y: rectY + rectH },
  ];
  let best = null, bestDist = thresholdPx;
  corners.forEach((c) => {
    polygon.forEach((v) => {
      const d = Math.hypot(v.x - c.x, v.y - c.y);
      if (d < bestDist) { bestDist = d; best = { dx: v.x - c.x, dy: v.y - c.y }; }
    });
  });
  if (best) return { x: rectX + best.dx, y: rectY + best.dy };
  return { x: rectX, y: rectY };
}

// A draggable top-down footprint of one 系統櫃 run (width × 60cm depth), placed over the floor
// plan. Drag anywhere on it; on release its corners magnet-snap to the room's traced wall corners.
// A tall (floor-to-ceiling) cabinet body is drawn as a square with both diagonals crossed (an
// "X"); a low cabinet gets only one diagonal. Every module in this tool is a full-height 240cm
// wardrobe unit, so today they all render as 高櫃 — the distinction is wired in for whenever a
// low-cabinet category exists.
function isTallModule() { return true; }

function CabinetFootprint({ space, calc, position, rotation, scaleCmPerPx, roomPolygon, svgRef, naturalWidth, naturalHeight, onCommit, onToggleRotation }) {
  const [dragPos, setDragPos] = useState(null);
  const [isDragging, setIsDragging] = useState(false);
  const dragStartRef = useRef(null);
  const latestPosRef = useRef(null);

  const runLenPx = Math.max(space.width / scaleCmPerPx, 6);
  const depthPx = Math.max(60 / scaleCmPerPx, 6);
  const rotated = rotation === 90;
  const totalW = rotated ? depthPx : runLenPx;
  const totalH = rotated ? runLenPx : depthPx;
  const pos = dragPos || position;

  const clientToImageDelta = (dxClient, dyClient) => {
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = naturalWidth / rect.width, scaleY = naturalHeight / rect.height;
    return { dx: dxClient * scaleX, dy: dyClient * scaleY };
  };

  // Window-level listeners while dragging — more reliable across browsers/touch devices than
  // relying purely on the dragged element's own pointer capture, which some mobile webviews
  // handle inconsistently once the finger moves outside the element's original hit area.
  useEffect(() => {
    if (!isDragging) return;
    const handleMove = (e) => {
      if (!dragStartRef.current) return;
      const { dx, dy } = clientToImageDelta(e.clientX - dragStartRef.current.startClientX, e.clientY - dragStartRef.current.startClientY);
      const next = { x: dragStartRef.current.startPos.x + dx, y: dragStartRef.current.startPos.y + dy };
      latestPosRef.current = next;
      setDragPos(next);
    };
    const handleUp = () => {
      const finalPos = latestPosRef.current || position;
      const snapped = snapRectToPolygonCorners(finalPos.x, finalPos.y, totalW, totalH, roomPolygon, 18);
      setIsDragging(false);
      dragStartRef.current = null;
      latestPosRef.current = null;
      setDragPos(null);
      onCommit(snapped);
    };
    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleUp);
    window.addEventListener("pointercancel", handleUp);
    return () => {
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleUp);
      window.removeEventListener("pointercancel", handleUp);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isDragging]);

  const onPointerDown = (e) => {
    e.preventDefault();
    e.stopPropagation();
    dragStartRef.current = { startClientX: e.clientX, startClientY: e.clientY, startPos: position };
    latestPosRef.current = position;
    setDragPos(position);
    setIsDragging(true);
  };

  const handleRotateClick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    onToggleRotation();
  };

  let cursorCm = 0;
  const modules = (calc && calc.modules) || [{ width: space.width }];
  const rotateBtnX = pos.x + totalW + 6, rotateBtnY = pos.y + 6;

  return (
    <g style={{ touchAction: "none" }}>
      <g onPointerDown={onPointerDown} style={{ cursor: isDragging ? "grabbing" : "grab" }}>
        {modules.map((m, i) => {
          const lenPx = m.width / scaleCmPerPx;
          const x0 = rotated ? pos.x : pos.x + cursorCm / scaleCmPerPx;
          const y0 = rotated ? pos.y + cursorCm / scaleCmPerPx : pos.y;
          const w = rotated ? depthPx : lenPx;
          const h = rotated ? lenPx : depthPx;
          cursorCm += m.width;
          const tall = isTallModule(m.category);
          return (
            <g key={i}>
              <rect x={x0} y={y0} width={w} height={h} fill={GOLD} fillOpacity="0.35" stroke={NAVY} strokeWidth="1.2" />
              {tall ? (
                <>
                  <line x1={x0} y1={y0} x2={x0 + w} y2={y0 + h} stroke={NAVY} strokeWidth="1" />
                  <line x1={x0 + w} y1={y0} x2={x0} y2={y0 + h} stroke={NAVY} strokeWidth="1" />
                </>
              ) : (
                <line x1={x0} y1={y0} x2={x0 + w} y2={y0 + h} stroke={NAVY} strokeWidth="1" />
              )}
            </g>
          );
        })}
        <text x={pos.x + totalW / 2} y={pos.y - 4} textAnchor="middle" fontSize={Math.min(depthPx * 0.4, 11)} fontWeight="700" fill={NAVY} stroke="#fff" strokeWidth="3" style={{ paintOrder: "stroke" }}>{space.name}</text>
      </g>
      <g onPointerDown={handleRotateClick} style={{ cursor: "pointer" }}>
        <circle cx={rotateBtnX} cy={rotateBtnY} r={Math.max(totalH * 0.22, 8)} fill={NAVY} fillOpacity="0.85" />
        <path
          d={`M ${rotateBtnX - 4} ${rotateBtnY} a 4 4 0 1 1 1.2 2.8 M ${rotateBtnX - 4} ${rotateBtnY} l 0 -2.5 M ${rotateBtnX - 4} ${rotateBtnY} l 2.2 0.6`}
          fill="none" stroke="#fff" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"
        />
      </g>
    </g>
  );
}

/* ---------------------------------------------------------------
   家具配置（簡化版）— 拖拉家具、旋轉、碰撞／超出房間邊界警告。
   簡化說明：
   - 只支援 0°／90° 旋轉（不是任意角度),所以碰撞判定用簡單的
     軸對齊矩形（AABB）重疊測試就夠了,不需要完整的 SAT 碰撞演算法
   - 沒有牆／門／窗物件,「超出房間」是用家具四個角是否都落在你
     框選的房間輪廓內來判斷,不是真正的牆體碰撞
   - 沒有 AI 自動配置、沒有動線淨空規則（clearance rules),都是
     PRD 裡才有的後端功能，這裡沒有伺服器可以做
----------------------------------------------------------------*/
const FURNITURE_LIBRARY = [
  { code: "BED_S", category: "臥室", name: "單人床", width: 100, depth: 200 },
  { code: "BED_120", category: "臥室", name: "120床", width: 120, depth: 200 },

  { code: "SHOE_CABINET", category: "玄關", name: "鞋櫃", width: 90, depth: 35 },

  { code: "WASHER", category: "家電", name: "洗衣機", width: 60, depth: 60 },

  { code: "SINK", category: "衛浴", name: "洗手台", width: 60, depth: 45 },
  { code: "BATHTUB", category: "衛浴", name: "浴缸", width: 160, depth: 70 },
  { code: "SHOWER", category: "衛浴", name: "淋浴區", width: 90, depth: 90 },
];
const FURNITURE_CATEGORIES = [...new Set(FURNITURE_LIBRARY.map((f) => f.category))];

function pointInPolygon(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    const intersect = (yi > pt.y) !== (yj > pt.y) && pt.x < ((xj - xi) * (pt.y - yi)) / (yj - yi) + xi;
    if (intersect) inside = !inside;
  }
  return inside;
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function furnitureRect(item, scaleCmPerPx) {
  const item2 = FURNITURE_LIBRARY.find((f) => f.code === item.code) || { width: 60, depth: 60 };
  const wCm = item.rotation === 90 ? item2.depth : item2.width;
  const hCm = item.rotation === 90 ? item2.width : item2.depth;
  return { x: item.x, y: item.y, w: wCm / scaleCmPerPx, h: hCm / scaleCmPerPx, name: item2.name };
}

function FurnitureItem({ item, position, rotation, scaleCmPerPx, roomPolygon, svgRef, naturalWidth, naturalHeight, hasCollision, onCommit, onToggleRotation, onRemove }) {
  const [dragPos, setDragPos] = useState(null);
  const [isDragging, setIsDragging] = useState(false);
  const dragStartRef = useRef(null);
  const latestPosRef = useRef(null);

  const lib = FURNITURE_LIBRARY.find((f) => f.code === item.code) || { name: item.code, width: 60, depth: 60 };
  const wCm = rotation === 90 ? lib.depth : lib.width;
  const hCm = rotation === 90 ? lib.width : lib.depth;
  const w = Math.max(wCm / scaleCmPerPx, 6);
  const h = Math.max(hCm / scaleCmPerPx, 6);
  const pos = dragPos || position;

  const clientToImageDelta = (dxClient, dyClient) => {
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = naturalWidth / rect.width, scaleY = naturalHeight / rect.height;
    return { dx: dxClient * scaleX, dy: dyClient * scaleY };
  };

  useEffect(() => {
    if (!isDragging) return;
    const handleMove = (e) => {
      if (!dragStartRef.current) return;
      const { dx, dy } = clientToImageDelta(e.clientX - dragStartRef.current.startClientX, e.clientY - dragStartRef.current.startClientY);
      const next = { x: dragStartRef.current.startPos.x + dx, y: dragStartRef.current.startPos.y + dy };
      latestPosRef.current = next;
      setDragPos(next);
    };
    const handleUp = () => {
      const finalPos = latestPosRef.current || position;
      const snapped = roomPolygon ? snapRectToPolygonCorners(finalPos.x, finalPos.y, w, h, roomPolygon, 14) : finalPos;
      setIsDragging(false);
      dragStartRef.current = null;
      latestPosRef.current = null;
      setDragPos(null);
      onCommit(snapped);
    };
    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleUp);
    window.addEventListener("pointercancel", handleUp);
    return () => {
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleUp);
      window.removeEventListener("pointercancel", handleUp);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isDragging]);

  const onPointerDown = (e) => {
    e.preventDefault();
    e.stopPropagation();
    dragStartRef.current = { startClientX: e.clientX, startClientY: e.clientY, startPos: position };
    latestPosRef.current = position;
    setDragPos(position);
    setIsDragging(true);
  };

  const color = hasCollision ? "#b0453a" : "#4A7C7C";

  return (
    <g style={{ touchAction: "none" }}>
      <g onPointerDown={onPointerDown} style={{ cursor: isDragging ? "grabbing" : "grab" }}>
        <rect x={pos.x} y={pos.y} width={w} height={h} fill={color} fillOpacity={hasCollision ? 0.35 : 0.3} stroke={color} strokeWidth="1.4" rx="2" />
        <text x={pos.x + w / 2} y={pos.y + h / 2 + 3} textAnchor="middle" fontSize={Math.min(h * 0.35, 10)} fontWeight="700" fill={color}>{lib.name}</text>
      </g>
      <g onPointerDown={(e) => { e.preventDefault(); e.stopPropagation(); onToggleRotation(); }} style={{ cursor: "pointer" }}>
        <circle cx={pos.x + w + 7} cy={pos.y + 7} r="7" fill={NAVY} fillOpacity="0.85" />
        <path d={`M ${pos.x + w + 3} ${pos.y + 7} a 4 4 0 1 1 1.2 2.8 M ${pos.x + w + 3} ${pos.y + 7} l 0 -2.5 M ${pos.x + w + 3} ${pos.y + 7} l 2.2 0.6`}
          fill="none" stroke="#fff" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" />
      </g>
      <g onPointerDown={(e) => { e.preventDefault(); e.stopPropagation(); onRemove(); }} style={{ cursor: "pointer" }}>
        <circle cx={pos.x + w + 7} cy={pos.y + h - 7} r="7" fill="#b0453a" fillOpacity="0.85" />
        <line x1={pos.x + w + 4} y1={pos.y + h - 10} x2={pos.x + w + 10} y2={pos.y + h - 4} stroke="#fff" strokeWidth="1.3" strokeLinecap="round" />
        <line x1={pos.x + w + 10} y1={pos.y + h - 10} x2={pos.x + w + 4} y2={pos.y + h - 4} stroke="#fff" strokeWidth="1.3" strokeLinecap="round" />
      </g>
    </g>
  );
}

function FurnitureLayoutCanvas({ room, floorPlan, setFloorPlan }) {
  const svgRef = useRef(null);
  const [activeCategory, setActiveCategory] = useState(FURNITURE_CATEGORIES[0]);
  const polygon = (floorPlan.roomPolygons || {})[room.code];
  const scale = floorPlan.scaleCmPerPx;
  const items = ((floorPlan.furniture || {})[room.code]) || [];

  if (!floorPlan.imageDataUrl || !scale || !polygon) {
    return <p style={{ fontSize: 12, color: "#8a8f9c" }}>請先到「案場平面圖」校正比例尺,並用「從平面圖框選」描出這個空間的範圍,才能配置家具。</p>;
  }

  const xs = polygon.map((p) => p.x), ys = polygon.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 40;
  const vbW = maxX - minX + pad * 2, vbH = maxY - minY + pad * 2;

  const setItems = (next) => {
    setFloorPlan((prev) => ({ ...prev, furniture: { ...(prev.furniture || {}), [room.code]: next } }));
  };
  const addItem = (code) => {
    const lib = FURNITURE_LIBRARY.find((f) => f.code === code);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const wPx = lib.width / scale, hPx = lib.depth / scale;
    const newItem = { id: Date.now(), code, x: cx - wPx / 2, y: cy - hPx / 2, rotation: 0 };
    setItems([...items, newItem]);
  };
  const updateItem = (id, patch) => setItems(items.map((it) => (it.id === id ? { ...it, ...patch } : it)));
  const removeItem = (id) => setItems(items.filter((it) => it.id !== id));

  // collision detection: furniture-vs-furniture (AABB overlap) + furniture extending past the room outline
  const rects = items.map((it) => ({ id: it.id, ...furnitureRect(it, scale) }));
  const collidingIds = new Set();
  const outOfBoundsIds = new Set();
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    const corners = [{ x: r.x, y: r.y }, { x: r.x + r.w, y: r.y }, { x: r.x, y: r.y + r.h }, { x: r.x + r.w, y: r.y + r.h }];
    if (!corners.every((c) => pointInPolygon(c, polygon))) outOfBoundsIds.add(r.id);
    for (let j = i + 1; j < rects.length; j++) {
      if (rectsOverlap(r, rects[j])) { collidingIds.add(r.id); collidingIds.add(rects[j].id); }
    }
  }

  return (
    <div>
      <div style={{ position: "relative", width: "100%", borderRadius: 8, overflow: "hidden", border: "1px solid #e4ddc8" }}>
        <img src={floorPlan.imageDataUrl} alt="平面圖" style={{ width: "100%", display: "block" }} />
        <svg ref={svgRef} viewBox={`0 0 ${floorPlan.naturalWidth} ${floorPlan.naturalHeight}`}
          style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%" }}>
          <polygon points={polygon.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke={NAVY} strokeWidth="2" opacity="0.8" />
          {items.map((it) => (
            <FurnitureItem
              key={it.id} item={it} position={{ x: it.x, y: it.y }} rotation={it.rotation} scaleCmPerPx={scale}
              roomPolygon={polygon} svgRef={svgRef} naturalWidth={floorPlan.naturalWidth} naturalHeight={floorPlan.naturalHeight}
              hasCollision={collidingIds.has(it.id) || outOfBoundsIds.has(it.id)}
              onCommit={(pos) => updateItem(it.id, pos)}
              onToggleRotation={() => updateItem(it.id, { rotation: it.rotation === 90 ? 0 : 90 })}
              onRemove={() => removeItem(it.id)}
            />
          ))}
        </svg>
      </div>

      {(collidingIds.size > 0 || outOfBoundsIds.size > 0) && (
        <div style={{ marginTop: 8, background: "#fdf2f0", border: "1px solid #e0c4bd", borderRadius: 8, padding: "8px 10px" }}>
          {collidingIds.size > 0 && <p style={{ fontSize: 12, color: "#b0453a", margin: "0 0 4px" }}>⚠ 有家具彼此重疊,請拖開調整。</p>}
          {outOfBoundsIds.size > 0 && <p style={{ fontSize: 12, color: "#b0453a", margin: 0 }}>⚠ 有家具超出房間範圍。</p>}
        </div>
      )}

      <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 6 }}>
        {FURNITURE_CATEGORIES.map((cat) => (
          <button key={cat} onClick={() => setActiveCategory(cat)}
            style={{ padding: "6px 12px", borderRadius: 7, border: activeCategory === cat ? `2px solid ${NAVY}` : "1px solid #d8d2c2", background: activeCategory === cat ? NAVY : "#fff", color: activeCategory === cat ? "#fff" : NAVY, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
            {cat}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
        {FURNITURE_LIBRARY.filter((f) => f.category === activeCategory).map((f) => (
          <button key={f.code} onClick={() => addItem(f.code)} style={smallBtnStyle}>
            <Plus size={11} /> {f.name}（{f.width}×{f.depth}）
          </button>
        ))}
      </div>
      <p style={{ fontSize: 10.5, color: "#b0aa90", marginTop: 8 }}>
        點家具可拖曳；右上圓點旋轉 90 度、右下圓點刪除,放開拖曳會吸附房間角點。紅色表示與其他家具重疊或超出房間範圍,僅供動線參考,不是精確碰撞檢查（沒有牆、門、窗物件）。
      </p>
    </div>
  );
}

// 天花板圖／木地板圖 — 用「整張」平面圖，每個已框選過的空間依施作內容套用不同 hatch，
// 有系統櫃的空間會疊上可拖曳、可磁吸牆角的櫃體平面示意。
function CombinedPlanView({ floorPlan, roomResults, setFloorPlan, planKind }) {

  };
  const toggleCabinetRotation = (spaceId) => {
    setFloorPlan((prev) => {
      const current = (prev.cabinetRotations || {})[spaceId] || 0;

  }

  return (
    <div>
      <div style={{ position: "relative", width: "100%", borderRadius: 8, overflow: "hidden", border: "1px solid #e4ddc8" }}>
        <img src={floorPlan.imageDataUrl} alt="平面圖" style={{ width: "100%", display: "block" }} />
        <svg ref={svgRef} viewBox={`0 0 ${floorPlan.naturalWidth} ${floorPlan.naturalHeight}`}
          style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%" }}>
          <defs>
            {roomResults.map(({ room }) => roomPolygons[room.code] && (
              <clipPath id={`${planKind}-clip-${room.code}`} key={room.code}>
                <polygon points={roomPolygons[room.code].map((p) => `${p.x},${p.y}`).join(" ")} />
              </clipPath>
            ))}
          </defs>

          {roomResults.map(({ room, work, workCalc }) => {
            const poly = roomPolygons[room.code];
            if (!poly) return null;
            const pts = poly.map((p) => `${p.x},${p.y}`).join(" ");
            const centroid = polygonCentroid(poly);

            if (showCabinets) {
              return (
                <g key={room.code}>
                  <polygon points={pts} fill="none" stroke={NAVY} strokeWidth="1.3" opacity="0.6" />
                  <text x={centroid.x} y={centroid.y} textAnchor="middle" fontSize="17" fontWeight="700" fill={NAVY} stroke="#fff" strokeWidth="4" style={{ paintOrder: "stroke" }}>{room.name}</text>
                </g>
              );
            }

            const active = planKind === "ceiling" ? workCalc.ceiling.code !== "NONE" : work.floorEnabled;
            const hatchLines = [];
            const spacing = 16;
            if (planKind === "ceiling" && workCalc.ceiling.code === "FLAT") {
              for (let d = -floorPlan.naturalHeight; d < floorPlan.naturalWidth; d += spacing) {
                hatchLines.push(<line key={d} x1={d} y1={0} x2={d + floorPlan.naturalHeight} y2={floorPlan.naturalHeight} stroke={GOLD} strokeWidth="1.4" opacity="0.75" />);
              }
            }
            if (planKind === "floor" && work.floorEnabled) {
              const vertical = work.floorDirection !== "PARALLEL";
              if (vertical) {
                for (let x = 0; x < floorPlan.naturalWidth; x += spacing) hatchLines.push(<line key={x} x1={x} y1={0} x2={x} y2={floorPlan.naturalHeight} stroke="#4A7C7C" strokeWidth="1.4" opacity="0.75" />);
              } else {
                for (let y = 0; y < floorPlan.naturalHeight; y += spacing) hatchLines.push(<line key={y} x1={0} y1={y} x2={floorPlan.naturalWidth} y2={y} stroke="#4A7C7C" strokeWidth="1.4" opacity="0.75" />);
              }
            }
            const beamPts = planKind === "ceiling" && workCalc.ceiling.code === "BEAM_WRAP" ? beamPaths[room.code] : null;

            return (
              <g key={room.code}>
                <polygon points={pts} fill={active ? "none" : "#fff"} fillOpacity={active ? 0 : 0.001} stroke={NAVY} strokeWidth={active ? 2.2 : 1} strokeDasharray={active ? "0" : "5 4"} opacity={active ? 0.95 : 0.4} />
                {hatchLines.length > 0 && <g clipPath={`url(#${planKind}-clip-${room.code})`}>{hatchLines}</g>}
                {beamPts && beamPts.length >= 2 && (
                  <polyline points={beamPts.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke="#b0453a" strokeWidth="6" strokeDasharray="16 9" strokeLinecap="round" />
                )}
                <text x={centroid.x} y={centroid.y} textAnchor="middle" fontSize="17" fontWeight="700" fill={NAVY} stroke="#fff" strokeWidth="4" style={{ paintOrder: "stroke" }}>{room.name}</text>
              </g>
            );
          })}

          {showCabinets && roomResults.flatMap(({ room, roomSpaces }) =>
            roomSpaces.map(({ space, calc }) => {
              const poly = roomPolygons[room.code];
              const centroid = poly ? polygonCentroid(poly) : { x: 40, y: 40 };
              const defaultPos = { x: centroid.x - (space.width / scale) / 2, y: centroid.y - (60 / scale) / 2 };
              const pos = cabinetPositions[space.id] || defaultPos;
              const rotation = cabinetRotations[space.id] || 0;
              return (
                <CabinetFootprint
                  key={space.id} space={space} calc={calc} position={pos} rotation={rotation} scaleCmPerPx={scale} roomPolygon={poly}
                  svgRef={svgRef} naturalWidth={floorPlan.naturalWidth} naturalHeight={floorPlan.naturalHeight}
                  onCommit={(newPos) => commitCabinetPosition(space.id, newPos)}
                  onToggleRotation={() => toggleCabinetRotation(space.id)}
                />
              );
            })
          )}
        </svg>
      </div>
      <p style={{ fontSize: 10.5, color: "#b0aa90", marginTop: 6 }}>
        {planKind === "ceiling" && "金色斜線＝平頂天花板（平釘）範圍；紅色粗虛線＝包樑走向；淺色虛線框＝未施作天花板的空間。"}
        {planKind === "floor" && "藍綠色平行線＝地板鋪設方向（僅示意，門的實際位置未記錄，施工前請現場確認）；淺色虛線框＝未施作地板的空間。"}
        {planKind === "cabinet" && "金色方塊為系統櫃平面示意（一個方型＝一個櫃體桶身,打叉表示高櫃),可拖曳移動,放開會自動吸附最近的牆角；右上角深藍色圓點可點擊旋轉 90 度。"}
      </p>
    </div>
  );
}

const TRADES = [
  { code: "CARPENTRY", name: "木工" },
  { code: "PAINT", name: "油漆" },
  { code: "CABINET", name: "系統櫃" },
  { code: "FLOOR", name: "木地板" },
  { code: "ELECTRICAL", name: "水電" },
  { code: "CLEANING", name: "清潔" },
];

const ACCESS_METHODS = [
  { code: "OWNER", name: "聯絡業主" },
  { code: "DESIGNER", name: "聯絡設計師" },
  { code: "MANAGEMENT", name: "鑰匙在管理室" },
  { code: "PASSWORD", name: "密碼鎖" },
  { code: "OTHER", name: "其他" },
];

function formatAccessMethod(siteAccess, projectInfo) {
  const method = ACCESS_METHODS.find((m) => m.code === siteAccess.accessMethod) || ACCESS_METHODS[0];
  if (method.code === "OWNER") return `聯絡業主${projectInfo.phone ? `（電話：${projectInfo.phone}）` : ""}`;
  if (method.code === "DESIGNER") return "聯絡設計師";
  if (method.code === "MANAGEMENT") return "鑰匙在管理室";
  if (method.code === "PASSWORD") return `密碼鎖（密碼：${siteAccess.accessPassword || "（尚未填寫）"}）`;
  if (method.code === "OTHER") return `其他：${siteAccess.accessNote || "（尚未填寫）"}`;
  return method.name;
}

function buildSiteHeader(tradeName, projectInfo, siteAccess, entryDate) {
  const lines = [`【${tradeName}採購單／進場資訊】`];
  if (projectInfo.customerName) lines.push(`客戶：${projectInfo.customerName}`);
  lines.push(`案場地址：${projectInfo.siteName || "（尚未填寫）"}`);
  lines.push(`進場時間：${entryDate || "（尚未填寫）"}`);
  lines.push(`開門方式：${formatAccessMethod(siteAccess, projectInfo)}`);
  lines.push(`大樓作業時間：${siteAccess.workingHours || "（尚未填寫）"}`);
  lines.push("");
  return lines;
}

function buildCarpentryPO(projectInfo, siteAccess, entryDate, roomResults) {
  const lines = buildSiteHeader("木工", projectInfo, siteAccess, entryDate);
  const items = roomResults.filter((r) => r.workCalc.ceilingPrice > 0 || r.work.curtainBoxLengthChi > 0);
  if (items.length === 0) { lines.push("（尚未設定天花板／窗簾盒等木工項目）"); return lines.join("\n"); }
  items.forEach((r) => {
    if (r.workCalc.ceilingPrice > 0) {
      if (r.workCalc.ceiling.code === "BEAM_WRAP") lines.push(`・${r.room.name} 天花板－包樑 ${r.work.beamLengthChi}尺`);
      else lines.push(`・${r.room.name} 天花板－${r.workCalc.ceiling.name} ${r.work.areaPing}坪`);
    }
    if (r.work.curtainBoxLengthChi > 0) lines.push(`・${r.room.name} 窗簾盒 ${r.work.curtainBoxLengthChi}尺`);
  });
  return lines.join("\n");
}

function buildPaintPO(projectInfo, siteAccess, entryDate, roomResults, paintType, paintWork, totalAreaPing, paintMaterial, baseColor) {
  const lines = buildSiteHeader("油漆", projectInfo, siteAccess, entryDate);
  const materialName = (PAINT_MATERIALS.find((m) => m.code === paintMaterial) || {}).name || "";
  const baseColorInfo = BASE_PAINT_COLORS.find((c) => c.code === baseColor) || BASE_PAINT_COLORS[0];
  lines.push(`全室材料：${materialName}`);
  lines.push(`全室底色：${baseColorInfo.name}（${baseColorInfo.code}）`);
  lines.push(`全室工法：${paintWork.paint.name}${paintWork.price > 0 ? `（總坪數 ${totalAreaPing}坪，小計 $${paintWork.price.toLocaleString()}）` : ""}`);
  lines.push("");
  const accentRooms = roomResults.filter((r) => r.work.accentEnabled);
  if (accentRooms.length === 0 && paintWork.price === 0) { lines.push("（尚未設定油漆施作）"); return lines.join("\n"); }
  if (accentRooms.length > 0) {
    lines.push("〈跳色〉");
    accentRooms.forEach((r) => {
      const accent = ACCENT_COLORS_16.find((c) => c.code === r.work.accentColorCode);
      lines.push(`・${r.room.name}：${accent ? accent.name : ""}（${r.work.accentColorCode}）`);
    });
  }
  return lines.join("\n");
}

function buildCabinetPO(projectInfo, siteAccess, entryDate, results) {
  const lines = buildSiteHeader("系統櫃", projectInfo, siteAccess, entryDate);
  const moduleCounts = {};
  const doorSet = new Set(), colorSet = new Set();
  const drawerTotals = {}, basketTotals = {};
  results.forEach(({ space, calc }) => {
    calc.modules.forEach((m, i) => {
      const key = `${m.data.code} ${m.data.name} ${m.width}cm`;
      moduleCounts[key] = (moduleCounts[key] || 0) + 1;
      (resolveDrawerHeights(space, i, m.category) || []).forEach((h) => { drawerTotals[h] = (drawerTotals[h] || 0) + 1; });
      (resolveBasketHeights(space, i, m.category) || []).forEach((h) => { basketTotals[h] = (basketTotals[h] || 0) + 1; });
    });
    doorSet.add(calc.door.name);
    colorSet.add(`${calc.color.code} ${calc.color.name}`);
  });
  if (Object.keys(moduleCounts).length === 0) {
    lines.push("（尚未配置任何系統櫃）");
    return lines.join("\n");
  }
  lines.push("〈櫃體模組〉");
  Object.entries(moduleCounts).forEach(([k, v]) => lines.push(`・${k} × ${v}`));
  lines.push("");
  lines.push(`〈門片〉${[...doorSet].join("、")}`);
  lines.push(`〈板材色號〉${[...colorSet].join("、")}`);
  if (Object.keys(drawerTotals).length) {
    lines.push("");
    lines.push("〈抽屜〉");
    Object.entries(drawerTotals).forEach(([h, q]) => lines.push(`・${h}cm × ${q}`));
  }
  if (Object.keys(basketTotals).length) {
    lines.push("");
    lines.push("〈拉籃〉");
    Object.entries(basketTotals).forEach(([h, q]) => lines.push(`・${h}cm × ${q}`));
  }
  return lines.join("\n");
}

function buildFloorPO(projectInfo, siteAccess, entryDate, roomResults) {
  const lines = buildSiteHeader("木地板", projectInfo, siteAccess, entryDate);
  lines.push(`〈材料〉${FLOOR_PRODUCT.name}`);
  let totalPing = 0;
  const floorRooms = roomResults.filter((r) => r.work.floorEnabled && r.work.areaPing > 0);
  if (floorRooms.length === 0) {
    lines.push("（尚未設定任何地板施作坪數）");
    return lines.join("\n");
  }
  floorRooms.forEach((r) => {
    const dirName = (FLOOR_DIRECTIONS.find((d) => d.code === r.work.floorDirection) || {}).name || "";
    lines.push(`・${r.room.name}：${r.work.areaPing}坪（鋪設走向：${dirName}）`);
    totalPing += r.work.areaPing;
  });
  lines.push("");
  lines.push(`總坪數：${totalPing}坪`);
  lines.push(`預估材料費：$${Math.round(totalPing * FLOOR_PRODUCT.pricePerPing).toLocaleString()}`);
  return lines.join("\n");
}

function buildElectricalPO(projectInfo, siteAccess, entryDate, roomResults) {
  const lines = buildSiteHeader("水電", projectInfo, siteAccess, entryDate);
  const items = roomResults.filter((r) => (r.work.downlightCount || 0) > 0);
  if (items.length === 0) { lines.push("（尚未設定任何空間的崁燈數量）"); return lines.join("\n"); }
  lines.push("〈崁燈〉");
  let total = 0;
  items.forEach((r) => { lines.push(`・${r.room.name} × ${r.work.downlightCount}盞`); total += r.work.downlightCount; });
  lines.push("");
  lines.push(`總數量：${total}盞`);
  return lines.join("\n");
}

function buildCleaningPO(projectInfo, siteAccess, entryDate, selectedCleaning) {
  const lines = buildSiteHeader("清潔", projectInfo, siteAccess, entryDate);
  if (selectedCleaning.length === 0) { lines.push("（尚未勾選清潔項目）"); return lines.join("\n"); }
  selectedCleaning.forEach((c) => lines.push(`・${c.name} × ${c.qty}${c.unit}`));
  return lines.join("\n");
}

function computeProfitCategories(roomResults, results, selectedProtection, selectedCleaning, transport, managementFee, tax, paintWork) {
  const cabinetItems = results.map(({ space, calc }) => {
    const cabinetCost = calc.modules.reduce((s, m) => s + (m.data.cost || 0), 0);
    const doorEligible = calc.modules.filter((m) => m.category !== "OPEN" && m.category !== "DISPLAY").length;
    const doorCost = doorEligible * (calc.door.cost || 0);
    const knownCost = cabinetCost + doorCost;
    const extras = calc.subtotal - calc.cabinetPrice - calc.doorPrice; // colorSurcharge + basketPrice — no cost data
    return { label: space.name, sale: calc.subtotal, cost: knownCost, hasCost: false, note: extras > 0 ? "不含顏色加價／拉籃的成本（無資料）" : null };
  });

  // 窗簾盒歸屬天花板工程（木工施作),連同天花板一起列
  const ceilingItems = [];
  roomResults.forEach((r) => {
    if (r.workCalc.ceilingPrice > 0) ceilingItems.push({ label: `${r.room.name}－${r.workCalc.ceiling.name}`, sale: r.workCalc.ceilingPrice, cost: 0, hasCost: false });
    if (r.workCalc.curtainPrice > 0) ceilingItems.push({ label: `${r.room.name}－窗簾盒`, sale: r.workCalc.curtainPrice, cost: 0, hasCost: false });
  });
  const floorItems = roomResults.filter((r) => r.workCalc.floorPrice > 0).map((r) => ({ label: r.room.name, sale: r.workCalc.floorPrice, cost: 0, hasCost: false }));
  // 油漆是全室一筆（不分空間),跳色仍逐空間列出
  const paintItems = [];
  if (paintWork.price > 0) paintItems.push({ label: `全室－${paintWork.paint.name}`, sale: paintWork.price, cost: 0, hasCost: false });
  roomResults.forEach((r) => {
    if (r.work.accentEnabled) {
      const accent = ACCENT_COLORS_16.find((c) => c.code === r.work.accentColorCode);
      paintItems.push({ label: `${r.room.name}－跳色（${accent ? accent.name : ""}）`, sale: 0, cost: 0, hasCost: false, note: "跳色目前未單獨計價" });
    }
  });
  const electricalItems = roomResults.filter((r) => (r.work.downlightCount || 0) > 0).map((r) => ({ label: `${r.room.name}（${r.work.downlightCount}盞）`, sale: r.workCalc.downlightPrice, cost: 0, hasCost: false }));

  // 窗簾（不含窗簾盒 — 窗簾盒歸在天花板／木工）
  const curtainItems = [];
  roomResults.forEach((r) => {
    (r.work.curtainItems || []).forEach((it) => {
      const typeName = (CURTAIN_TYPES.find((t) => t.code === it.type) || {}).name || it.type;
      const hasCost = it.cost != null;
      curtainItems.push({ label: `${r.room.name}－${typeName}`, sale: it.price, cost: hasCost ? it.cost : 0, hasCost });
    });
  });

  const sharedItems = selectedProtection.map((p) => ({ label: `保護工程－${p.name}（${p.qty}${p.unit}）`, sale: p.subtotal, cost: 0, hasCost: false }));
  selectedCleaning.forEach((c) => sharedItems.push({ label: `清潔工程－${c.name}（${c.qty}${c.unit}）`, sale: c.subtotal, cost: 0, hasCost: false }));

  const buildCategory = (name, items) => {
    const sale = items.reduce((s, it) => s + it.sale, 0);
    const cost = items.reduce((s, it) => s + it.cost, 0);
    const hasFullCost = items.length > 0 && items.every((it) => it.hasCost);
    const hasAnyCost = items.some((it) => it.hasCost);
    return { name, items, sale, cost, hasFullCost, hasAnyCost };
  };

  return [
    buildCategory("天花板", ceilingItems),
    buildCategory("油漆", paintItems),
    buildCategory("水電（崁燈）", electricalItems),
    buildCategory("木地板", floorItems),
    buildCategory("系統櫃", cabinetItems),
    buildCategory("窗簾", curtainItems),
    buildCategory("共同工程", sharedItems),
    buildCategory("運送", [{ label: transport.name, sale: transport.price, cost: 0, hasCost: false }]),
    buildCategory("工程管理費＋稅金", [
      { label: "工程管理費 (8%)", sale: managementFee, cost: 0, hasCost: false },
      { label: "稅金 (5%)", sale: tax, cost: 0, hasCost: false },
    ]),
  ];
}

        <div style={{ fontSize: 11, letterSpacing: 1, color: GOLD, fontWeight: 700, marginBottom: 4 }}>整案</div>
        <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
          <div><div style={{ fontSize: 11, opacity: 0.7 }}>售價</div><div style={{ fontSize: 20, fontWeight: 800 }}>${grandSale.toLocaleString()}</div></div>
          <div><div style={{ fontSize: 11, opacity: 0.7 }}>成本</div><div style={{ fontSize: 20, fontWeight: 800 }}>${grandCost.toLocaleString()}</div></div>
          <div><div style={{ fontSize: 11, opacity: 0.7 }}>利潤</div><div style={{ fontSize: 20, fontWeight: 800, color: GOLD }}>${grandProfit.toLocaleString()}</div></div>
        </div>
      </div>

      {categories.map((cat) => (
        <div key={cat.name} style={{ background: "#fff", border: "1px solid #e4ddc8", borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
          <div onClick={() => toggle(cat.name)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 14px", cursor: "pointer", background: "#fbf9f3" }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: NAVY }}>{cat.name}</span>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ fontSize: 12, color: "#5b6478" }}>售 ${cat.sale.toLocaleString()}　成 ${cat.cost.toLocaleString()}{!cat.hasFullCost && cat.items.length > 0 ? "＊" : ""}</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: NAVY }}>利 ${(cat.sale - cat.cost).toLocaleString()}</span>
              {expanded[cat.name] ? <ChevronUp size={16} color={NAVY} /> : <ChevronDown size={16} color={NAVY} />}
            </div>
          </div>
          {expanded[cat.name] && (
            <div style={{ padding: "8px 14px 12px" }}>
              {cat.items.length === 0 && <p style={{ fontSize: 12, color: "#8a8f9c", margin: 0 }}>目前沒有項目。</p>}
              {cat.items.map((it, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: i < cat.items.length - 1 ? "1px solid #f0ece0" : "none" }}>
                  <div>
                    <div style={{ fontSize: 13, color: NAVY }}>{it.label}</div>
                    {it.note && <div style={{ fontSize: 10.5, color: "#b0aa90" }}>{it.note}</div>}
                  </div>
                  <div style={{ textAlign: "right", fontSize: 12, color: "#5b6478" }}>
                    售 ${it.sale.toLocaleString()}　成 ${it.cost.toLocaleString()}{!it.hasCost ? "＊" : ""}　利 ${(it.sale - it.cost).toLocaleString()}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
      <p style={{ fontSize: 10.5, color: "#b0aa90", marginTop: 4 }}>＊表示該項目沒有成本資料，成本以 $0 計，利潤僅供參考。</p>
    </div>
  );
}

function NumberField({ label, value, onChange, min, max }) {
  // Free typing needs an uncommitted local buffer — clamping on every keystroke (e.g. while the
  // field is briefly empty or below `min` mid-edit) was snapping the value back and blocking input.
  const [text, setText] = useState(String(value));
  useEffect(() => { setText(String(value)); }, [value]);

  const commit = (raw) => {
    const v = Number(raw);
    if (raw.trim() !== "" && !Number.isNaN(v)) {
      const clamped = Math.min(max, Math.max(min, v));
      setText(String(clamped));
      if (clamped !== value) onChange(clamped);
    } else {
      setText(String(value));
    }
  };

  return (
    <label style={{ fontSize: 13 }}>
      <div style={{ marginBottom: 4, color: "#5b6478" }}>{label}</div>
      <input
        type="number"
        inputMode="numeric"
        value={text}
        min={min}
        max={max}
        onChange={(e) => setText(e.target.value)}
        onBlur={(e) => commit(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") { e.target.blur(); } }}
        style={{ width: 100, padding: "8px 10px", borderRadius: 8, border: "1px solid #d8d2c2", fontSize: 15, fontWeight: 700, color: NAVY }}
      />
    </label>
  );
}

function StaticField({ label, value }) {
  return (
    <div style={{ fontSize: 13 }}>
      <div style={{ marginBottom: 4, color: "#5b6478" }}>{label}</div>
      <div style={{ width: 100, padding: "8px 10px", borderRadius: 8, border: "1px solid #eee7d6", background: "#f0ece0", fontSize: 15, fontWeight: 700, color: "#8a8060" }}>{value}</div>
    </div>
  );
}

function SelectGrid({ options, value, onChange, render }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(150px,1fr))", gap: 8 }}>
      {options.map((o) => (
        <button key={o.code} onClick={() => onChange(o.code)}
          style={{ textAlign: "left", padding: "10px 12px", borderRadius: 8, border: value === o.code ? `2px solid ${NAVY}` : "1px solid #e4ddc8", background: "#fff", cursor: "pointer" }}>
          {render(o)}
        </button>
      ))}
    </div>
  );
}

function Stepper({ value, onChange }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <button onClick={() => onChange(Math.max(0, value - 1))} style={btnStyle}>−</button>
      <span style={{ fontSize: 13, fontWeight: 700, width: 16, textAlign: "center" }}>{value}</span>
      <button onClick={() => onChange(value + 1)} style={btnStyle}>+</button>
    </div>
  );
}

const btnStyle = { width: 22, height: 22, borderRadius: 6, border: "1px solid #d8d2c2", background: "#f6f3ec", cursor: "pointer", fontSize: 14, lineHeight: "1" };

function PriceLine({ label, value, bold, big }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: big ? 18 : 13, fontWeight: bold ? 800 : 500, marginBottom: 6, color: bold ? "#fff" : "rgba(255,255,255,0.75)" }}>
      <span>{label}</span>
      <span>${value.toLocaleString()}</span>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
