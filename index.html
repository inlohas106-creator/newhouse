function colorSurchargeRate(grade) {

const MAX_FILLER = 5;

function intersectWidths(categories) {
  const sets = categories.map((c) => CATEGORY_META[c].widths);
  return sets[0].filter((w) => sets.every((s) => s.includes(w))).sort((a, b) => b - a);
}

function decompose(total, widths) {
  if (total <= 0) return { pieces: [], filler: 0 };
  const dp = new Array(total + 1).fill(-1);
  dp[0] = 0;
  for (let s = 1; s <= total; s++) {
    for (const w of widths) {
      if (s >= w && dp[s - w] !== -1) {
        const cand = dp[s - w] + 1;
        if (dp[s] === -1 || cand < dp[s]) dp[s] = cand;
      }
    }
  }
  let best = -1;
  const floor = Math.max(0, total - MAX_FILLER);
  for (let s = total; s >= floor; s--) {
    if (dp[s] !== -1) { best = s; break; }
  }
  if (best === -1) {
    for (let s = total; s >= 0; s--) {
      if (dp[s] !== -1) { best = s; break; }
    }
  }
  const pieces = [];
  let remaining = best;
  while (remaining > 0) {
    for (const w of widths) {
      if (remaining >= w && dp[remaining - w] === dp[remaining] - 1) {
        pieces.push(w);
        remaining -= w;
        break;
      }
    }
  }
  return { pieces, filler: total - best };
}

function buildModules(templateId, totalWidth) {
  const tpl = TEMPLATES.find((t) => t.id === templateId);
  if (templateId === "couple") {
    const leftPattern = ["DOUBLE_HANGING", "DRAWER"];
    const rightPattern = ["LONG_HANGING", "SHELF"];
    const leftWidths = intersectWidths(leftPattern);
    const rightWidths = intersectWidths(rightPattern);
    const leftTotal = Math.round(totalWidth / 2 / 10) * 10;
    const rightTotal = totalWidth - leftTotal;
    const left = decompose(leftTotal, leftWidths);
    const right = decompose(rightTotal, rightWidths);
    const leftMods = left.pieces.map((w, i) => ({ category: leftPattern[i % leftPattern.length], width: w }));
    const rightMods = right.pieces.map((w, i) => ({ category: rightPattern[i % rightPattern.length], width: w }));
    return { modules: [...leftMods, ...rightMods], filler: left.filler + right.filler, split: { leftTotal, rightTotal } };
  }
  const widths = intersectWidths(tpl.pattern);
  const { pieces, filler } = decompose(totalWidth, widths);
  const modules = pieces.map((w, i) => ({ category: tpl.pattern[i % tpl.pattern.length], width: w }));
  return { modules, filler, split: null };
}

function findModuleData(category, width) {
  return MODULES.find((m) => m.category === category && m.width === width);
}

function nextValidCategory(currentCategory, width) {
  const cats = Object.keys(CATEGORY_META);
  const idx = cats.indexOf(currentCategory);
  for (let step = 1; step <= cats.length; step++) {
    const cand = cats[(idx + step) % cats.length];
    if (CATEGORY_META[cand].widths.includes(width)) return cand;
  }
  return currentCategory;
}

const BASKET_UNIT_PRICE = 2000;

function computeSpace(space) {
  const built = buildModules(space.templateId, space.width);
  const modules = built.modules.map((m, i) => {
    const category = space.overrides[i] || m.category;
    const data = findModuleData(category, m.width) || findModuleData(m.category, m.width);
    return { ...m, category: data.category, data };
  });
  const door = DOORS.find((d) => d.code === space.doorCode);
  const color = MATERIAL_COLORS.find((c) => c.code === space.colorCode) || MATERIAL_COLORS[0];
  const cabinetPrice = modules.reduce((sum, m) => sum + m.data.price, 0);
  const doorEligible = modules.filter((m) => m.category !== "OPEN" && m.category !== "DISPLAY");
  const doorPrice = doorEligible.length * door.price;
  const basketCount = Object.values(space.basketOverrides || {}).reduce((sum, arr) => sum + (arr ? arr.length : 0), 0);
  const basketPrice = basketCount * BASKET_UNIT_PRICE;
  // 板材顏色加價：E/F 色只對板材本體（櫃體＋門片）加價15%
  const surchargeRate = colorSurchargeRate(color.grade);
  const colorSurcharge = Math.round((cabinetPrice + doorPrice) * surchargeRate);
  const subtotal = cabinetPrice + doorPrice + basketPrice + colorSurcharge;
  return { built, modules, door, color, cabinetPrice, doorPrice, basketCount, basketPrice, colorSurcharge, subtotal };
}

/* ---------------------------------------------------------------
   案場平面圖 — upload a floor-plan image, calibrate a known real-world
   length against it, then trace room outlines to get a rough area
   (m² / 坪). All client-side; nothing is uploaded anywhere.
----------------------------------------------------------------*/
function polygonAreaPx2(points) {
  let sum = 0;
  for (let i = 0; i < points.length; i++) {
    const { x: x1, y: y1 } = points[i];
    const { x: x2, y: y2 } = points[(i + 1) % points.length];
    sum += x1 * y2 - x2 * y1;
  }
  return Math.abs(sum) / 2;
}

function matchRoomTypeCode(name, usedCodes) {
  if (name.includes("玄關")) return usedCodes.has("ENTRANCE") ? null : "ENTRANCE";
  if (name.includes("客廳")) return usedCodes.has("LIVING") ? null : "LIVING";
  if (name.includes("餐廳")) return usedCodes.has("DINING") ? null : "DINING";
  if (name.includes("主臥")) return usedCodes.has("MASTER") ? null : "MASTER";
  if (name.includes("次臥") || name.includes("客房") || name.includes("小孩房")) {
    if (!usedCodes.has("BED_A")) return "BED_A";
    if (!usedCodes.has("BED_B")) return "BED_B";
    return null;
  }
  return null; // 廚房／衛浴／書房／儲藏室等，目前系統的空間類型清單裡沒有，無法自動套用
}

function FloorPlanTool({ floorPlan, setFloorPlan, measuringRoom, onMeasured, onCancelMeasure, updateRoomWork }) {
  const [mode, setMode] = useState("idle"); // idle | calibrate
  const [calibPoints, setCalibPoints] = useState([]);
  const [calibInput, setCalibInput] = useState("");
  const [currentPolygon, setCurrentPolygon] = useState([]);
  const svgRef = useRef(null);
  const canvasRef = useRef(null);
  const drawing = !!measuringRoom;
  const drawingLength = drawing && (measuringRoom.kind === "beam" || measuringRoom.kind === "curtain");
  const [aiRecognizing, setAiRecognizing] = useState(false);
  const [aiResult, setAiResult] = useState(null); // { rooms: [{name, polygon, matchedCode}], notes }
  const [aiError, setAiError] = useState(null);
  const [aiSelected, setAiSelected] = useState({}); // { index: boolean }

  const recognizeFloorPlan = async () => {
    setAiRecognizing(true);
    setAiError(null);
    setAiResult(null);
    try {
      const match = floorPlan.imageDataUrl.match(/^data:([^;]+);base64,(.*)$/);
      if (!match) throw new Error("圖片格式無法解析");
      const [, mediaType, base64] = match;
      const res = await fetch("/api/recognize-floorplan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageBase64: base64, mediaType }),
      });
      const rawText = await res.text();
      let data;
      try {
        data = JSON.parse(rawText);
      } catch (parseErr) {
        throw new Error(`伺服器沒有回傳可用的內容（HTTP ${res.status}）。可能是函式逾時或設定問題，請到 Netlify 後台的 Functions 頁籤查看 recognize-floorplan 的 log。`);
      }
      if (!res.ok) {
        const detail = data.raw ? `\n\n詳細內容：${JSON.stringify(data.raw).slice(0, 800)}` : "";
        throw new Error((data.error || `辨識失敗（HTTP ${res.status}）`) + detail);
      }
      const usedCodes = new Set();
      const withCodes = data.rooms.map((r) => {
        const code = matchRoomTypeCode(r.name || "", usedCodes);
        if (code) usedCodes.add(code);
        return { ...r, matchedCode: code };
      });
      setAiResult({ rooms: withCodes, notes: data.notes });
      const initSelected = {};
      withCodes.forEach((r, i) => { if (r.matchedCode) initSelected[i] = true; });
      setAiSelected(initSelected);
    } catch (err) {
      setAiError(err.message || "辨識時發生錯誤");
    } finally {
      setAiRecognizing(false);
    }
  };

  const applyAiResults = () => {
    if (!aiResult) return;
    const newPolygons = { ...(floorPlan.roomPolygons || {}) };
    aiResult.rooms.forEach((r, i) => {
      if (!aiSelected[i] || !r.matchedCode || !Array.isArray(r.polygon) || r.polygon.length < 3) return;
      const pxPoly = r.polygon.map(([rx, ry]) => ({ x: rx * floorPlan.naturalWidth, y: ry * floorPlan.naturalHeight }));
      newPolygons[r.matchedCode] = pxPoly;
      if (floorPlan.scaleCmPerPx) {
        const areaCm2 = polygonAreaPx2(pxPoly) * floorPlan.scaleCmPerPx * floorPlan.scaleCmPerPx;
        const ping = Number((areaCm2 / 10000 / 3.305785).toFixed(2));
        updateRoomWork(r.matchedCode, { areaPing: ping });
      }
    });
    setFloorPlan((prev) => ({ ...prev, roomPolygons: newPolygons }));
    setAiResult(null);
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        setFloorPlan({ imageDataUrl: reader.result, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight, scaleCmPerPx: null });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  // draw the floor plan into an offscreen canvas so clicks can sample real pixels to snap to
  useEffect(() => {
    if (!floorPlan || !floorPlan.imageDataUrl || !canvasRef.current) return;
    const canvas = canvasRef.current;
    canvas.width = floorPlan.naturalWidth;
    canvas.height = floorPlan.naturalHeight;
    const ctx = canvas.getContext("2d");
    const img = new window.Image();
    img.onload = () => { ctx.drawImage(img, 0, 0); };
    img.src = floorPlan.imageDataUrl;
  }, [floorPlan && floorPlan.imageDataUrl, floorPlan && floorPlan.naturalWidth, floorPlan && floorPlan.naturalHeight]);

  // Snap a click to the nearest nearby line intersection (wall corner) instead of trusting the
  // raw tap — floor-plan photos are drawn with fairly thin dark lines on a light background, so a
  // pixel with a lot of dark neighbours in BOTH a horizontal and a vertical band is likely a corner.
  const snapToIntersection = (px, py) => {
    const canvas = canvasRef.current;
    if (!canvas) return { x: px, y: py };
    const R = 16;
    const x0 = Math.max(0, Math.round(px - R));
    const y0 = Math.max(0, Math.round(py - R));
    const w = Math.min(canvas.width - x0, R * 2 + 1);
    const h = Math.min(canvas.height - y0, R * 2 + 1);
    if (w <= 4 || h <= 4) return { x: px, y: py };
    let data;
    try {
      data = canvas.getContext("2d").getImageData(x0, y0, w, h).data;
    } catch (err) {
      return { x: px, y: py }; // e.g. tainted canvas — just fall back to the raw click
    }
    const isDark = (lx, ly) => {
      if (lx < 0 || ly < 0 || lx >= w || ly >= h) return false;
      const idx = (ly * w + lx) * 4;
      const lum = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
      return lum < 150;
    };
    let candidates = [];
    for (let ly = 2; ly < h - 2; ly++) {
      for (let lx = 2; lx < w - 2; lx++) {
        if (!isDark(lx, ly)) continue;
        let hCount = 0, vCount = 0;
        for (let d = -6; d <= 6; d++) {
          if (isDark(lx + d, ly)) hCount++;
          if (isDark(lx, ly + d)) vCount++;
        }
        const score = Math.min(hCount, vCount);
        if (score >= 5) candidates.push({ lx, ly });
      }
    }
    if (candidates.length === 0) return { x: px, y: py };
    // A wall corner is usually drawn as two intersecting lines with some thickness, which can
    // produce more than one qualifying pixel (e.g. the outer and inner face of the wall). Pick
    // whichever candidate is closest to where the user actually tapped — since they're tracing
    // a room from the inside, that's normally the inside corner, not the outer wall face.
    let best = candidates[0], bestDist = Infinity;
    candidates.forEach((c) => {
      const d = Math.hypot(x0 + c.lx - px, y0 + c.ly - py);
      if (d < bestDist) { bestDist = d; best = c; }
    });
    return { x: x0 + best.lx, y: y0 + best.ly };
  };

  const toImageCoords = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = floorPlan.naturalWidth / rect.width;
    const scaleY = floorPlan.naturalHeight / rect.height;
    const raw = { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    return snapToIntersection(raw.x, raw.y);
  };

  const handleSvgClick = (e) => {
    const p = toImageCoords(e);
    if (mode === "calibrate") {
      if (calibPoints.length < 2) setCalibPoints((prev) => [...prev, p]);
      return;
    }
    if (!drawing || !floorPlan.scaleCmPerPx) return;
    setCurrentPolygon((prev) => [...prev, p]);
  };

  const confirmCalibration = () => {
    const cm = Number(calibInput);
    if (!cm || calibPoints.length < 2) return;
    const [p1, p2] = calibPoints;
    const pxDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (pxDist === 0) return;
    setFloorPlan((prev) => ({ ...prev, scaleCmPerPx: cm / pxDist }));
    setCalibPoints([]);
    setCalibInput("");
    setMode("idle");
  };

  const undoPoint = () => {
    if (mode === "calibrate") setCalibPoints((prev) => prev.slice(0, -1));
    else if (drawing) setCurrentPolygon((prev) => prev.slice(0, -1));
  };

  const cancelCalibrate = () => {
    setMode("idle");
    setCalibPoints([]);
    setCalibInput("");
  };

  const cancelDrawing = () => {
    setCurrentPolygon([]);
    if (onCancelMeasure) onCancelMeasure();
  };

  const finishArea = () => {
    if (currentPolygon.length < 3 || !floorPlan.scaleCmPerPx) return;
    const areaCm2 = polygonAreaPx2(currentPolygon) * floorPlan.scaleCmPerPx * floorPlan.scaleCmPerPx;
    const ping = areaCm2 / 10000 / 3.305785;
    const roomCode = measuringRoom.code;
    const tracedPoints = currentPolygon;
    setFloorPlan((prev) => ({ ...prev, roomPolygons: { ...(prev.roomPolygons || {}), [roomCode]: tracedPoints } }));
    setCurrentPolygon([]);
    if (onMeasured) onMeasured(Number(ping.toFixed(2)));
  };

  // 包樑 often turns corners — sum every segment of the traced path, not just a straight 2-point line.
  const pathLengthCm = (points) => {
    let cm = 0;
    for (let i = 1; i < points.length; i++) {
      cm += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    }
    return cm * (floorPlan.scaleCmPerPx || 0);
  };

  const finishLength = () => {
    if (currentPolygon.length < 2 || !floorPlan.scaleCmPerPx) return;
    const cm = pathLengthCm(currentPolygon);
    if (measuringRoom.kind === "beam") {
      const roomCode = measuringRoom.code;
      const tracedPoints = currentPolygon;
      setFloorPlan((prev) => ({ ...prev, beamPaths: { ...(prev.beamPaths || {}), [roomCode]: tracedPoints } }));
    }
    setCurrentPolygon([]);
    if (onMeasured) onMeasured(cm);
  };

  if (!floorPlan) {
    return (
      <div>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>案場平面圖</div>
        <label style={{
          display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
          border: "2px dashed #cfc7ac", borderRadius: 10, padding: "16px", cursor: "pointer", color: "#5b6478", fontSize: 13,
        }}>
          <Upload size={16} /> 上傳平面圖照片
          <input type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
        </label>
      </div>
    );
  }

  const dotR = floorPlan.naturalWidth / 160;
  const lineW = Math.max(floorPlan.naturalWidth / 350, 1.5);

  return (
    <div>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>案場平面圖</div>

      {drawing && (
        <div style={{ background: NAVY, color: "#fff", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>
          正在為「{measuringRoom.name}」{measuringRoom.kind === "beam" ? "測量包樑長度" : measuringRoom.kind === "curtain" ? "測量窗簾盒長度" : "框選面積範圍"}
        </div>
      )}

      <div style={{ position: "relative", width: "100%", borderRadius: 8, overflow: "hidden", border: "1px solid #e4ddc8" }}>
        <img src={floorPlan.imageDataUrl} alt="平面圖" style={{ width: "100%", display: "block" }} />
        <canvas ref={canvasRef} style={{ display: "none" }} />
        <svg
          ref={svgRef}
          viewBox={`0 0 ${floorPlan.naturalWidth} ${floorPlan.naturalHeight}`}
          style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", cursor: mode === "idle" && !drawing ? "default" : "crosshair" }}
          onClick={handleSvgClick}
        >
          {currentPolygon.length > 0 && (
            <polyline points={currentPolygon.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke={NAVY} strokeWidth={lineW} />
          )}
          {currentPolygon.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r={dotR} fill={NAVY} />)}
          {calibPoints.length === 2 && <line x1={calibPoints[0].x} y1={calibPoints[0].y} x2={calibPoints[1].x} y2={calibPoints[1].y} stroke="#c0392b" strokeWidth={lineW} />}
          {calibPoints.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r={dotR} fill="#c0392b" />)}
        </svg>
      </div>

      {!drawing && mode === "idle" && (
        <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
          <button onClick={() => setMode("calibrate")} style={smallBtnStyle}>校正比例尺</button>
          <button onClick={() => setFloorPlan(null)} style={{ ...smallBtnStyle, color: "#b0453a", borderColor: "#e0c4bd" }}>移除平面圖</button>
          <button onClick={recognizeFloorPlan} disabled={aiRecognizing} style={{ ...smallBtnStyle, background: NAVY, color: "#fff", opacity: aiRecognizing ? 0.6 : 1 }}>
            <Sparkles size={12} /> {aiRecognizing ? "AI 辨識中…" : "AI 辨識房間"}
          </button>
        </div>
      )}

      {aiError && (
        <div style={{ marginTop: 8, background: "#fdf2f0", border: "1px solid #e0c4bd", borderRadius: 8, padding: 10 }}>
          <p style={{ fontSize: 12, color: "#b0453a", margin: 0, whiteSpace: "pre-wrap" }}>{aiError}</p>
        </div>
      )}

      {aiResult && (
        <div style={{ marginTop: 8, background: "#fbf9f3", border: "1px solid #eee7d6", borderRadius: 8, padding: 10 }}>
          <p style={{ fontSize: 12, color: "#5b6478", margin: "0 0 8px" }}>AI 判讀結果，請確認後套用（套用後仍可用「從平面圖框選」手動修正）：</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
            {aiResult.rooms.map((r, i) => (
              <label key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: r.matchedCode ? "pointer" : "default", opacity: r.matchedCode ? 1 : 0.55 }}>
                <input type="checkbox" disabled={!r.matchedCode} checked={!!aiSelected[i]} onChange={(e) => setAiSelected((prev) => ({ ...prev, [i]: e.target.checked }))} />
                {r.name}
                {r.matchedCode ? <span style={{ fontSize: 11, color: "#8a8f9c" }}>→ {(ROOM_TYPES.find((rt) => rt.code === r.matchedCode) || {}).name}</span> : <span style={{ fontSize: 11, color: "#b0453a" }}>（目前空間類型清單裡沒有這個房型，無法自動套用）</span>}
              </label>
            ))}
          </div>
          {aiResult.notes && <p style={{ fontSize: 11, color: "#b0aa90", marginBottom: 8 }}>AI 備註：{aiResult.notes}</p>}
          {!floorPlan.scaleCmPerPx && <p style={{ fontSize: 11.5, color: "#b0453a", marginBottom: 8 }}>尚未校正比例尺，套用後會先存範圍，坪數要等校正完成才會自動算出。</p>}
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={applyAiResults} style={{ ...smallBtnStyle, background: NAVY, color: "#fff" }}><Check size={12} /> 套用勾選的房間</button>
            <button onClick={() => setAiResult(null)} style={smallBtnStyle}><X size={12} /> 取消</button>
          </div>
        </div>
      )}

      {!drawing && mode === "calibrate" && (
        <div style={{ marginTop: 8, background: "#fbf9f3", border: "1px solid #eee7d6", borderRadius: 8, padding: 10 }}>
          <p style={{ fontSize: 12, color: "#5b6478", margin: "0 0 8px" }}>在圖上點兩下,標出一段你知道實際長度的線（例如一面牆）。</p>
          {calibPoints.length === 2 && (
            <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 8 }}>
              <input value={calibInput} onChange={(e) => setCalibInput(e.target.value)} placeholder="這段實際長度 (cm)" inputMode="numeric"
                style={{ flex: 1, padding: "7px 10px", borderRadius: 6, border: "1px solid #d8d2c2", fontSize: 13 }} />
              <button onClick={confirmCalibration} style={{ ...smallBtnStyle, background: NAVY, color: "#fff" }}><Check size={13} /></button>
            </div>
          )}
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={undoPoint} style={smallBtnStyle}><Undo2 size={12} /> 回上一點</button>
            <button onClick={cancelCalibrate} style={smallBtnStyle}><X size={12} /> 取消</button>
          </div>
        </div>
      )}

      {drawing && !floorPlan.scaleCmPerPx && (
        <div style={{ marginTop: 8, background: "#fdf2f0", border: "1px solid #e0c4bd", borderRadius: 8, padding: 10 }}>
          <p style={{ fontSize: 12.5, color: "#b0453a", margin: "0 0 8px" }}>請先「校正比例尺」才能測量。</p>
          <button onClick={cancelDrawing} style={smallBtnStyle}><X size={12} /> 取消</button>
        </div>
      )}

      {drawing && floorPlan.scaleCmPerPx && drawingLength && (
        <div style={{ marginTop: 8, background: "#fbf9f3", border: "1px solid #eee7d6", borderRadius: 8, padding: 10 }}>
          <p style={{ fontSize: 12, color: "#5b6478", margin: "0 0 8px" }}>依序點選「{measuringRoom.name}」{measuringRoom.kind === "curtain" ? "窗簾盒" : "包樑"}的每個轉折點（至少2點),會自動加總每一段的長度,完成後按「完成」。</p>
          {currentPolygon.length >= 2 && (
            <p style={{ fontSize: 12.5, fontWeight: 700, color: NAVY, margin: "0 0 8px" }}>目前總長：{pathLengthCm(currentPolygon).toFixed(1)}cm（約{(pathLengthCm(currentPolygon) / CM_PER_CHI).toFixed(2)}尺）</p>
          )}
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={undoPoint} style={smallBtnStyle}><Undo2 size={12} /> 回上一點</button>
            <button onClick={finishLength} disabled={currentPolygon.length < 2} style={{ ...smallBtnStyle, background: NAVY, color: "#fff", opacity: currentPolygon.length < 2 ? 0.4 : 1 }}>
              <Check size={12} /> 完成
            </button>
            <button onClick={cancelDrawing} style={smallBtnStyle}><X size={12} /> 取消</button>
          </div>
        </div>
      )}

      {drawing && floorPlan.scaleCmPerPx && !drawingLength && (
        <div style={{ marginTop: 8, background: "#fbf9f3", border: "1px solid #eee7d6", borderRadius: 8, padding: 10 }}>
          <p style={{ fontSize: 12, color: "#5b6478", margin: "0 0 8px" }}>依序點選「{measuringRoom.name}」的每個角點（至少3點),完成後按「完成」。點擊時會自動吸附到附近偵測到的線條交點。</p>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={undoPoint} style={smallBtnStyle}><Undo2 size={12} /> 回上一點</button>
            <button onClick={finishArea} disabled={currentPolygon.length < 3} style={{ ...smallBtnStyle, background: NAVY, color: "#fff", opacity: currentPolygon.length < 3 ? 0.4 : 1 }}>
              <Check size={12} /> 完成
            </button>
            <button onClick={cancelDrawing} style={smallBtnStyle}><X size={12} /> 取消</button>
          </div>
        </div>
      )}

      {floorPlan.scaleCmPerPx && !drawing && mode === "idle" && (
        <p style={{ fontSize: 11, color: "#8a8f9c", marginTop: 6 }}>已校正比例尺（可重新校正以覆蓋）</p>
      )}
      <p style={{ fontSize: 10.5, color: "#b0aa90", marginTop: 8 }}>面積／長度為依平面圖描繪估算的概略值，僅供估價參考，實際請以現場丈量為準。</p>
    </div>
  );
}

// Curtain box (窗簾盒) — priced per 尺 like beam-wrap, only relevant to rooms with windows worth dressing.
const CURTAIN_BOX_PRICE_PER_CHI = 500;
const CURTAIN_BOX_ROOMS = ["LIVING", "MASTER", "BED_A", "BED_B"];

// Window coverings (布簾/捲簾/百葉簾/調光簾/蜂巢簾) — same room scope as the curtain box.
// No pricing formula was given yet, so each item's price is just typed in for now.
const CURTAIN_TYPES = [
  { code: "FABRIC", name: "布簾" },
  { code: "ROLLER", name: "捲簾" },
  { code: "VENETIAN", name: "百葉簾" },

  { code: "HONEYCOMB", name: "蜂巢簾" },
];

// 跳色 (accent wall) is only offered in rooms that also get curtains dressed — living room + bedrooms.
const ACCENT_WALL_ROOMS = ["LIVING", "MASTER", "BED_A", "BED_B"];

function makeRoomWork(roomCode) {
  return {
    ceilingType: "NONE", floorEnabled: false, floorDirection: "PERPENDICULAR",
    areaPing: 0, beamLengthChi: 0, downlightCount: defaultDownlightCount(roomCode),
    accentEnabled: false, accentColorCode: ACCENT_COLORS_16[0].code,
    curtainBoxLengthChi: 0, curtainItems: [],
  };
}

function computeRoomWork(work, roomCode) {
  const ceiling = CEILING_TYPES.find((c) => c.code === work.ceilingType) || CEILING_TYPES[0];
  let ceilingPrice = 0;
  if (ceiling.code === "BEAM_WRAP") ceilingPrice = Math.round(ceiling.price * (work.beamLengthChi || 0));
  else if (ceiling.code !== "NONE") ceilingPrice = Math.round(ceiling.price * work.areaPing);
  const floorPrice = work.floorEnabled ? Math.round(FLOOR_PRODUCT.pricePerPing * work.areaPing) : 0;
  const downlightPrice = Math.round(DOWNLIGHT_UNIT_PRICE * (work.downlightCount || 0));
  const curtainApplicable = CURTAIN_BOX_ROOMS.includes(roomCode);
  const curtainPrice = curtainApplicable ? Math.round(CURTAIN_BOX_PRICE_PER_CHI * (work.curtainBoxLengthChi || 0)) : 0;
  const curtainItemsPrice = (work.curtainItems || []).reduce((s, it) => s + (Number(it.price) || 0), 0);
  return {
    ceiling, ceilingPrice, floorPrice, downlightPrice, curtainApplicable, curtainPrice, curtainItemsPrice,
    subtotal: ceilingPrice + floorPrice + downlightPrice + curtainPrice + curtainItemsPrice,
  };
}

// 油漆工程是全室一起施作，不分空間分別選 — 一種工法套用在所選空間的總坪數上。
function computePaintWork(paintType, totalAreaPing) {
  const paint = PAINT_TYPES.find((p) => p.code === paintType) || PAINT_TYPES[0];
  const price = paint.code === "NONE" ? 0 : Math.round(paint.price * totalAreaPing);
  return { paint, price };
}

// since a static web page has no way to address a specific LINE contact without official
// LINE Login/Messaging API integration.
function shareTextToLine(text) {
  window.open("https://line.me/R/msg/text/?" + encodeURIComponent(text), "_blank");
}

  { code: "contract", name: "簽約" },

];

function App() {
  const [activeTab, setActiveTab] = useState("quote");
  const [projectInfo, setProjectInfo] = useState({ customerName: "", siteName: "", phone: "" });
  const [floorPlan, setFloorPlan] = useState(null);
  const [selectedRooms, setSelectedRooms] = useState(["MASTER"]);
  const [roomWork, setRoomWork] = useState({ MASTER: makeRoomWork("MASTER") });
  const [spaces, setSpaces] = useState([makeSpace("主臥衣櫃", { id: 1, width: 280, templateId: "couple", room: "MASTER" })]);
  const [expanded, setExpanded] = useState({ 1: true });
  const [transportCode, setTransportCode] = useState("TPE");
  const [summaryOpen, setSummaryOpen] = useState(false);
  const [protectionQty, setProtectionQty] = useState({}); // { CODE: quantity } — presence = enabled
  const [cleaningQty, setCleaningQty] = useState({}); // { CODE: quantity } — presence = enabled
  const [paintType, setPaintType] = useState("NONE"); // 全室油漆施工方式 — one choice for the whole project
  const [paintMaterial, setPaintMaterial] = useState("LATEX");
  const [baseColor, setBaseColor] = useState(BASE_PAINT_COLORS[0].code);
  const [siteAccess, setSiteAccess] = useState({ accessMethod: "OWNER", accessPassword: "", accessNote: "", workingHours: "" });
  const [tradeSchedule, setTradeSchedule] = useState({});

  const setTradeEntryDate = (tradeCode, date) => {
    setTradeSchedule((prev) => ({ ...prev, [tradeCode]: date }));
  };

  const toggleRoom = (code) => {
    setSelectedRooms((prev) => (prev.includes(code) ? prev.filter((c) => c !== code) : [...prev, code]));
    setRoomWork((prev) => (prev[code] ? prev : { ...prev, [code]: makeRoomWork(code) }));
  };
  const updateRoomWork = (code, patch) => {
    setRoomWork((prev) => ({ ...prev, [code]: { ...(prev[code] || makeRoomWork(code)), ...patch } }));
  };

  const addSpace = (roomCode) => {
    const roomName = (ROOM_TYPES.find((r) => r.code === roomCode) || {}).name || "";
    const countInRoom = spaces.filter((s) => s.room === roomCode).length;
    const s = makeSpace(`${roomName}系統櫃${countInRoom + 1}`, { room: roomCode });
    setSpaces((prev) => [...prev, s]);
    setExpanded((prev) => ({ ...prev, [s.id]: true }));
  };
  const removeSpace = (id) => setSpaces((prev) => prev.filter((s) => s.id !== id));
  const updateSpace = (id, patch) => setSpaces((prev) => prev.map((s) => (s.id === id ? { ...s, ...patch } : s)));
  const toggleExpand = (id) => setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));

  const results = useMemo(() => spaces.map((space) => ({ space, calc: computeSpace(space) })), [spaces]);
  const cabinetSubtotal = results.reduce((sum, r) => sum + r.calc.subtotal, 0);
  const transport = TRANSPORT.find((t) => t.code === transportCode);

  const roomResults = useMemo(() => selectedRooms.map((code) => {
    const room = ROOM_TYPES.find((r) => r.code === code);
    const work = roomWork[code] || makeRoomWork(code);
    const workCalc = computeRoomWork(work, code);
    const roomSpaces = results.filter((r) => r.space.room === code);
    const cabinetTotal = roomSpaces.reduce((s, r) => s + r.calc.subtotal, 0);
    return { room, work, workCalc, roomSpaces, roomTotal: workCalc.subtotal + cabinetTotal };
  }), [selectedRooms, roomWork, results]);

  const roomWorkTotal = roomResults.reduce((s, r) => s + r.workCalc.subtotal, 0);
  const totalAreaPing = roomResults.reduce((s, r) => s + (r.work.areaPing || 0), 0);

  const toggleProtectionItem = (code) => {
    setProtectionQty((prev) => {
      if (code in prev) { const next = { ...prev }; delete next[code]; return next; }
      const item = PROTECTION_ITEMS.find((p) => p.code === code);
      return { ...prev, [code]: item.byArea ? totalAreaPing : 1 };
    });
  };
  const setProtectionItemQty = (code, qty) => setProtectionQty((prev) => ({ ...prev, [code]: qty }));
  const toggleCleaningItem = (code) => {
    setCleaningQty((prev) => {
      if (code in prev) { const next = { ...prev }; delete next[code]; return next; }
      const item = CLEANING_ITEMS.find((c) => c.code === code);
      return { ...prev, [code]: item.byArea ? totalAreaPing : 1 };
    });
  };
  const setCleaningItemQty = (code, qty) => setCleaningQty((prev) => ({ ...prev, [code]: qty }));

  const selectedProtection = PROTECTION_ITEMS.filter((p) => p.code in protectionQty).map((p) => ({ ...p, qty: protectionQty[p.code], subtotal: Math.round(p.price * protectionQty[p.code]) }));
  const protectionTotal = selectedProtection.reduce((s, p) => s + p.subtotal, 0);
  const selectedCleaning = CLEANING_ITEMS.filter((c) => c.code in cleaningQty).map((c) => ({ ...c, qty: cleaningQty[c.code], subtotal: Math.round(c.price * cleaningQty[c.code]) }));
  const cleaningTotal = selectedCleaning.reduce((s, c) => s + c.subtotal, 0);
  const paintWork = computePaintWork(paintType, totalAreaPing);
  const sharedTotal = protectionTotal + cleaningTotal + paintWork.price;

  // 工程管理費(8%) + 稅金(5%)，都是直接算在整案小計上（不是疊加計算），對齊實際報價單的算法。
  const grandSubtotal = cabinetSubtotal + roomWorkTotal + sharedTotal + transport.price;
  const managementFee = Math.round(grandSubtotal * 0.08);
  const tax = Math.round(grandSubtotal * 0.05);
  const grandTotal = grandSubtotal + managementFee + tax;

  return (
    <div style={{ fontFamily: '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif', background: PAPER, color: NAVY, minHeight: "100vh", padding: "24px 16px 100px" }}>
      <style>{GLOBAL_CSS}</style>
      <div style={{ maxWidth: 980, margin: "0 auto" }}>
        <header className="no-print" style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 13, letterSpacing: 1, color: GOLD, fontWeight: 600, marginBottom: 6 }}>狸樂聚 · 新屋簡易報價／簽約／採購系統</div>
          <h1 style={{ fontSize: 26, fontWeight: 700, margin: 0, lineHeight: 1.3 }}>新屋裝修快速估價</h1>
          <p style={{ margin: "6px 0 0", color: "#5b6478", fontSize: 14 }}>選空間、配天地、配系統櫃，一次完成報價、簽約與採購單。</p>
        </header>

        <div className="no-print" style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          {TABS.map((t) => (
            <button key={t.code} onClick={() => setActiveTab(t.code)}
              style={{ flex: 1, padding: "10px", borderRadius: 10, border: activeTab === t.code ? `2px solid ${NAVY}` : "1px solid #d8d2c2", background: activeTab === t.code ? NAVY : "#fff", color: activeTab === t.code ? "#fff" : NAVY, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
              {t.name}
            </button>
          ))}
        </div>

        {activeTab === "quote" && (
          <QuoteView
            projectInfo={projectInfo} setProjectInfo={setProjectInfo}
            floorPlan={floorPlan} setFloorPlan={setFloorPlan}
            selectedRooms={selectedRooms} toggleRoom={toggleRoom}
            updateRoomWork={updateRoomWork} roomResults={roomResults}
            addSpace={addSpace} removeSpace={removeSpace} updateSpace={updateSpace}
            expanded={expanded} toggleExpand={toggleExpand}
            transportCode={transportCode} setTransportCode={setTransportCode}
            managementFee={managementFee} tax={tax} transport={transport}
            protectionQty={protectionQty} toggleProtectionItem={toggleProtectionItem} setProtectionItemQty={setProtectionItemQty}
            cleaningQty={cleaningQty} toggleCleaningItem={toggleCleaningItem} setCleaningItemQty={setCleaningItemQty}
            paintType={paintType} setPaintType={setPaintType} paintWork={paintWork}
            paintMaterial={paintMaterial} setPaintMaterial={setPaintMaterial}
            baseColor={baseColor} setBaseColor={setBaseColor}
            selectedProtection={selectedProtection} selectedCleaning={selectedCleaning} sharedTotal={sharedTotal}
            grandSubtotal={grandSubtotal} grandTotal={grandTotal}
            summaryOpen={summaryOpen} setSummaryOpen={setSummaryOpen}
          />
        )}
        {activeTab === "contract" && (
          <ContractView
            projectInfo={projectInfo} roomResults={roomResults} managementFee={managementFee} tax={tax} transport={transport}
            selectedProtection={selectedProtection} selectedCleaning={selectedCleaning} sharedTotal={sharedTotal}
            paintType={paintType} paintWork={paintWork} paintMaterial={paintMaterial} baseColor={baseColor}
            floorPlan={floorPlan} setFloorPlan={setFloorPlan}
            grandSubtotal={grandSubtotal} grandTotal={grandTotal}
          />
        )}
        {activeTab === "procurement" && (
          <ProcurementView
            projectInfo={projectInfo} roomResults={roomResults} results={results}
            paintType={paintType} paintWork={paintWork} totalAreaPing={totalAreaPing}
            paintMaterial={paintMaterial} baseColor={baseColor} selectedCleaning={selectedCleaning}
            siteAccess={siteAccess} setSiteAccess={setSiteAccess}
            tradeSchedule={tradeSchedule} setTradeEntryDate={setTradeEntryDate}
          />
        )}
        {activeTab === "profit" && (
          <ProfitView
            roomResults={roomResults} results={results} selectedProtection={selectedProtection} selectedCleaning={selectedCleaning}
            transport={transport} managementFee={managementFee} tax={tax} paintWork={paintWork}
          />
        )}
      </div>
    </div>
  );
}

// Lets a room's 坪數 be typed directly, pulled by tracing straight on the floor plan (delegated
// up to FloorPlanTool via onStartDraw, since that's where the image actually lives), or computed
// from a quick 長×寬 (cm) entry — all three just set the same numeric value.
function AreaPicker({ label, value, onChange, floorPlan, onStartDraw, isMeasuring }) {
  const [mode, setMode] = useState("idle"); // idle | fromDims
  const [lengthCm, setLengthCm] = useState("");
  const [widthCm, setWidthCm] = useState("");

  const applyFromDims = () => {
    const l = Number(lengthCm), w = Number(widthCm);
    if (!l || !w) return;
    const ping = (l * w) / 10000 / 3.305785;
    onChange(Number(ping.toFixed(2)));
    setMode("idle");
    setLengthCm(""); setWidthCm("");
  };

  return (
    <div>
      <NumberField label={label} value={value} onChange={onChange} min={0} max={200} />
      <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
        <button onClick={onStartDraw} disabled={!floorPlan || isMeasuring} style={{ ...smallBtnStyle, opacity: !floorPlan || isMeasuring ? 0.5 : 1 }}>
          {isMeasuring ? "請至上方平面圖框選…" : "從平面圖框選"}
        </button>
        <button onClick={() => setMode(mode === "fromDims" ? "idle" : "fromDims")} style={smallBtnStyle}>用長寬計算</button>
      </div>

      {!floorPlan && <p style={{ fontSize: 11, color: "#8a8f9c", marginTop: 6 }}>尚未上傳平面圖，可以先到上方「案場平面圖」上傳。</p>}

      {mode === "fromDims" && (
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
          <input value={lengthCm} onChange={(e) => setLengthCm(e.target.value)} placeholder="長 cm" inputMode="numeric"
            style={{ width: 80, padding: "7px 8px", borderRadius: 6, border: "1px solid #d8d2c2", fontSize: 12 }} />
          <span style={{ fontSize: 12, color: "#8a8f9c" }}>×</span>
          <input value={widthCm} onChange={(e) => setWidthCm(e.target.value)} placeholder="寬 cm" inputMode="numeric"
            style={{ width: 80, padding: "7px 8px", borderRadius: 6, border: "1px solid #d8d2c2", fontSize: 12 }} />
          <button onClick={applyFromDims} style={{ ...smallBtnStyle, background: NAVY, color: "#fff" }}>套用</button>
        </div>
      )}
    </div>
  );
}

// Window coverings — no pricing formula yet, so 預估售價 is just typed in per item for now.
// 布簾 (fabric curtain) pricing — transcribed from the uploaded Excel (品牌 A only; brand B's
// digit-extraction rule wasn't given as a working formula, only described in words).
// Two small errors in the sheet's own formulas are corrected here (noted at each spot).
function roundUpTo(value, decimals) {
  const f = Math.pow(10, decimals);
  return Math.ceil(value * f) / f;
}
const FABRIC_CURTAIN_FOLD_MULTIPLIER = 2.4; // 折幅
const FABRIC_CURTAIN_BRAND_A = { costDiscount: 0.3, saleDiscount: 0.7 }; // 成本/售價 幾折

function computeFabricCurtainPrice(code, widthCm, heightCm, fabricWidthCm) {
  const codeStr = String(code || "").trim();
  const W = Number(widthCm), H = Number(heightCm), wide = Number(fabricWidthCm);
  if (codeStr.length < 4 || !W || !H || !wide) return null;
  const dollarRate = Number(codeStr.slice(1, 4)); // Excel: MID(編號,2,3)
  if (Number.isNaN(dollarRate)) return null;
  const sellRate = dollarRate * FABRIC_CURTAIN_BRAND_A.saleDiscount; // 售價=
  const costRate = dollarRate * FABRIC_CURTAIN_BRAND_A.costDiscount; // 成本=
  const orderPanelsRaw = (W * FABRIC_CURTAIN_FOLD_MULTIPLIER) / wide;
  const orderPanels = roundUpTo(orderPanelsRaw, 1); // 下單幾幅
  const actualPanels = Math.ceil(orderPanelsRaw); // 實際幾幅
  const heightFactor = (H + 30) / 90; // 高幅
  const fabricCost = Math.round(heightFactor * actualPanels * sellRate); // 布$ (售價側)
  const fabricCostBasis = Math.round(heightFactor * actualPanels * costRate); // 布$ (成本側)
  const hardwareCost = (W / 30) * 80; // 窗材 (same for both sides in the sheet)
  // Excel's false-branch referenced an empty cell (D11) instead of 下單幾幅 (C11) — using the
  // intended reference here, matching the parallel 成本 block which has no such typo.
  const laborCost = H > 270 ? actualPanels * 200 * 2 : orderPanels * 200; // 車工 (same for both sides)
  // Excel's own 售價 cell summed C15:C18, i.e. including itself (a circular reference) — using
  // the non-circular sum of the three cost lines, which is what that formula clearly intended.
  const totalPrice = Math.round(fabricCost + hardwareCost + laborCost);
  const totalCost = Math.round(fabricCostBasis + hardwareCost + laborCost);
  return { dollarRate, sellRate, costRate, orderPanels, actualPanels, heightFactor, fabricCost, hardwareCost, laborCost, totalPrice, totalCost };
}

function CurtainItemsEditor({ items, onChange }) {

  const isFabric = draft.type === "FABRIC";
  const fabricCalc = isFabric ? computeFabricCurtainPrice(draft.fabricCode, draft.widthCm, draft.lengthCm, draft.fabricWidthCm) : null;

  const addItem = () => {
    if (!draft.lengthCm || !draft.widthCm) return;
    if (isFabric && !fabricCalc) return; // need a valid code + dimensions before it can be priced
    const item = {
      id: Date.now(),
      type: draft.type,
      lengthCm: Number(draft.lengthCm),
      widthCm: Number(draft.widthCm),

      price: isFabric ? fabricCalc.totalPrice : (Number(draft.price) || 0),
      cost: isFabric ? fabricCalc.totalCost : null,

    onChange([...items, item]);
    setDraft({ type: draft.type, lengthCm: "", widthCm: "", model: "", price: "", fabricCode: "", fabricWidthCm: draft.fabricWidthCm });

  const removeItem = (id) => onChange(items.filter((it) => it.id !== id));

    <div>

        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {items.map((it) => {
            const typeName = (CURTAIN_TYPES.find((t) => t.code === it.type) || {}).name || it.type;
            return (
              <div key={it.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "#fff", border: "1px solid #e4ddc8", borderRadius: 8, padding: "6px 10px", flexWrap: "wrap" }}>

                {it.model && <span style={{ fontSize: 12, color: "#5b6478" }}>{it.type === "FABRIC" ? "編號" : "型號"}：{it.model}</span>}
                <span style={{ fontSize: 12.5, fontWeight: 700, color: NAVY, marginLeft: "auto" }}>${it.price.toLocaleString()}</span>
                <button onClick={() => removeItem(it.id)} style={{ border: "none", background: "none", color: "#b0453a", cursor: "pointer", padding: 2 }}>
                  <Trash2 size={14} />
                </button>
              </div>
            );
          })}
        </div>
      )}

      <div style={{ background: "#fbf9f3", border: "1px solid #eee7d6", borderRadius: 8, padding: 10 }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
          {CURTAIN_TYPES.map((t) => (
            <button key={t.code} onClick={() => setDraft((d) => ({ ...d, type: t.code }))}
              style={{ padding: "6px 10px", borderRadius: 7, border: draft.type === t.code ? `2px solid ${NAVY}` : "1px solid #d8d2c2", background: draft.type === t.code ? NAVY : "#fff", color: draft.type === t.code ? "#fff" : NAVY, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              {t.name}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
          <input value={draft.lengthCm} onChange={(e) => setDraft((d) => ({ ...d, lengthCm: e.target.value }))} placeholder="長(高) cm" inputMode="numeric" style={{ ...inputStyle, width: 80 }} />
          <input value={draft.widthCm} onChange={(e) => setDraft((d) => ({ ...d, widthCm: e.target.value }))} placeholder="寬 cm" inputMode="numeric" style={{ ...inputStyle, width: 74 }} />

            </>

            <>
              <input value={draft.model} onChange={(e) => setDraft((d) => ({ ...d, model: e.target.value }))} placeholder="型號" style={{ ...inputStyle, width: 90 }} />

              <p style={{ fontSize: 12, color: "#8a8f9c" }}>請先到上方「案場平面圖」上傳並校正比例尺。</p>
            )}
          </Section>
        </div>
      )}
    </div>
  );
}

/* ---- illustrated interior drawing (line-art style, mirrors the paper 標準立面圖) ---- */
// Real cabinetry zone heights (cm) — from actual shop drawings, not arbitrary fractions.
const SHORT_HANG_CM = 90;   // shirts / jackets clearance
const LONG_HANG_CM = 140;   // coats / dresses clearance
const SHELF_UNIT_CM = 40;   // one folded-clothes shelf
const DRAWER_UNIT_CM = 25;  // one standard drawer front
const MAX_DRAWER_STACK_CM = 120; // drawers never stack higher than this from the floor

function GarmentIcon({ x, yTop, height, color }) {
  const shoulder = Math.max(10, height * 0.42);
  return (
    <g stroke={color} strokeWidth="1" fill="none" opacity="0.85">
      <circle cx={x} cy={yTop - 10} r="1.4" fill={color} stroke="none" />
      <line x1={x} y1={yTop - 8.5} x2={x} y2={yTop - 2} />
      <path d={`M ${x - shoulder / 2} ${yTop} L ${x} ${yTop - 4} L ${x + shoulder / 2} ${yTop}`} />
      <path
        d={`M ${x - shoulder / 2} ${yTop} L ${x - shoulder / 2.5} ${yTop + height} L ${x + shoulder / 2.5} ${yTop + height} L ${x + shoulder / 2} ${yTop} Z`}
        fill="#fff" fillOpacity="0.55"
      />
    </g>
  );
}

function hangingContent(x, y, w, h, long, color) {
  const rodY = y + 9;
  const count = Math.max(2, Math.round(w / 24));
  const garmentH = long ? h - 20 : h * 0.6;
  const items = [];
  for (let i = 0; i < count; i++) {
    const cx = x + (w / (count + 1)) * (i + 1);
    items.push(<GarmentIcon key={i} x={cx} yTop={rodY + 5} height={garmentH} color={color} />);
  }
  return (
    <>
      <line x1={x + 4} y1={rodY} x2={x + w - 4} y2={rodY} stroke={color} strokeWidth="1.3" />
      {items}
    </>
  );
}

function doubleHangingContent(x, y, w, h, color) {
  const bandH = h / 2;
  return (
    <>
      {hangingContent(x, y, w, bandH, false, color)}
      {hangingContent(x, y + bandH, w, bandH, false, color)}
    </>
  );
}

function shelfContent(x, y, w, h, color, dim, rows) {
  const rowH = h / rows;
  const els = [];
  for (let r = 1; r < rows; r++) {
    els.push(<line key={`l${r}`} x1={x + 2} y1={y + rowH * r} x2={x + w - 2} y2={y + rowH * r} stroke={color} strokeWidth="1" opacity={dim ? 0.4 : 0.7} />);
  }
  for (let r = 0; r < rows; r++) {
    const boxW = Math.min(w * 0.3, 20);
    const boxH = rowH * 0.42;
    const cx = x + w * (r % 2 === 0 ? 0.25 : 0.58);
    const cy = y + rowH * r + rowH * 0.3;
    els.push(
      <g key={`b${r}`}>
        <rect x={cx} y={cy} width={boxW} height={boxH} rx="1.5" stroke={color} strokeWidth="0.9" fill="#fff" fillOpacity={dim ? 0.25 : 0.5} />
        <line x1={cx + 2} y1={cy + boxH * 0.5} x2={cx + boxW - 2} y2={cy + boxH * 0.5} stroke={color} strokeWidth="0.7" opacity="0.6" />
      </g>
    );
  }
  return <>{els}</>;
}

function drawerContent(x, y, w, heightsCm, scale, color, onDrawerClick) {
  // Each drawer can be an individually-chosen height (15/25/35cm) — stack them at their real px size.
  const els = [];
  let cursorY = y;
  heightsCm.forEach((hCm, i) => {
    const dH = hCm * scale;
    const dy = cursorY;
    els.push(
      <g key={i} onClick={onDrawerClick ? (e) => { e.stopPropagation(); onDrawerClick(i); } : undefined} style={{ cursor: onDrawerClick ? "pointer" : "default" }}>
        <rect x={x + 3} y={dy + 3} width={w - 6} height={Math.max(dH - 6, 4)} rx="2" stroke={color} strokeWidth="1" fill="#fff" fillOpacity="0.35" />
        <line x1={x + w / 2 - 9} y1={dy + dH / 2} x2={x + w / 2 + 9} y2={dy + dH / 2} stroke={color} strokeWidth="1.6" strokeLinecap="round" />
        {dH > 14 && <text x={x + w - 8} y={dy + dH / 2 - 7} textAnchor="end" fontSize="7" fill={color} opacity="0.55">{hCm}</text>}
      </g>
    );
    cursorY += dH;
  });
  return <>{els}</>;
}

function basketContent(x, y, w, heightsCm, scale, color, onBasketClick) {
  // Wire-basket look: a shallow front panel plus a crosshatch to read differently from a drawer.
  const els = [];
  let cursorY = y;
  heightsCm.forEach((hCm, i) => {
    const dH = hCm * scale;
    const dy = cursorY;
    const bx = x + 3, bw = w - 6, by = dy + 3, bh = Math.max(dH - 6, 4);
    const hatch = [];
    const step = Math.max(bw / 5, 6);
    for (let hx = bx + step; hx < bx + bw; hx += step) {
      hatch.push(<line key={hx} x1={hx} y1={by} x2={hx - bh * 0.4} y2={by + bh} stroke={color} strokeWidth="0.6" opacity="0.45" />);
    }
    els.push(
      <g key={i} onClick={onBasketClick ? (e) => { e.stopPropagation(); onBasketClick(i); } : undefined} style={{ cursor: onBasketClick ? "pointer" : "default" }}>
        <rect x={bx} y={by} width={bw} height={bh} rx="2" stroke={color} strokeWidth="1" fill="#fff" fillOpacity="0.2" />
        {hatch}
        {dH > 14 && <text x={x + w - 8} y={dy + dH / 2 - 7} textAnchor="end" fontSize="7" fill={color} opacity="0.55">{hCm}</text>}
      </g>
    );
    cursorY += dH;
  });
  return <>{els}</>;
}

function displayContent(x, y, w, h, color, rows) {
  const rowH = h / rows;
  const els = [];
  for (let r = 0; r < rows; r++) {
    els.push(<line key={`d${r}`} x1={x + 2} y1={y + rowH * (r + 1)} x2={x + w - 2} y2={y + rowH * (r + 1)} stroke={color} strokeWidth="0.8" opacity="0.5" />);
    const bagW = Math.min(w * 0.24, 17);
    const cx = x + w * (r % 2 === 0 ? 0.32 : 0.6);
    const bagY = y + rowH * r + rowH * 0.32;
    els.push(
      <g key={`bag${r}`}>
        <path d={`M ${cx + 2} ${bagY} q ${bagW / 2 - 2} -8 ${bagW - 4} 0`} stroke={color} strokeWidth="0.9" fill="none" />
        <rect x={cx} y={bagY} width={bagW} height={bagW * 0.72} rx="2" stroke={color} strokeWidth="0.9" fill="#fff" fillOpacity="0.7" />
      </g>
    );
  }
  return (
    <>
      <rect x={x + 2} y={y + 2} width={w - 4} height={h - 4} fill="#EAF2F8" opacity="0.5" />
      {els}
      <line x1={x + w * 0.12} y1={y + h * 0.08} x2={x + w * 0.5} y2={y + h * 0.92} stroke="#fff" strokeWidth="7" opacity="0.4" />
    </>
  );
}

// Real cabinetry proportions: the top blind-storage box and floor kick are roughly FIXED cm
// values (not a percentage of total height) — a 240cm and a 260cm wardrobe both get about the
// same ~45cm top box and ~9cm kick, per typical shop drawings. A glass display cabinet skips the
// top box entirely (lit shelving runs almost to the top).
function zoneCm(category) {
  if (category === "DISPLAY") return { valance: 0, kick: 9 };
  return { valance: 45, kick: 9 };
}

function realInteriorCm(category) {
  const { valance, kick } = zoneCm(category);
  return 240 - valance - kick;
}

const DRAWER_PRESETS_CM = [15, 25, 35];
function nextDrawerHeight(h) {
  const idx = DRAWER_PRESETS_CM.indexOf(h);
  return DRAWER_PRESETS_CM[(idx + 1) % DRAWER_PRESETS_CM.length];
}

// Default (un-edited) drawer stack for a module — same allocation rule as before, just expressed
// as an explicit array of 25cm drawers instead of a bare count, so it can be edited afterward.
function autoDrawerHeights(category, interiorCm) {
  if (category === "DRAWER") {
    const cap = Math.min(MAX_DRAWER_STACK_CM, interiorCm);
    const count = Math.max(1, Math.floor(cap / DRAWER_UNIT_CM));
    return Array(count).fill(DRAWER_UNIT_CM);
  }
  if (category === "HANGING" || category === "LONG_HANGING") {
    const hangTarget = category === "LONG_HANGING" ? LONG_HANG_CM : SHORT_HANG_CM;
    const leftover = Math.max(0, interiorCm - hangTarget);
    const count = Math.floor(leftover / DRAWER_UNIT_CM);
    return Array(count).fill(DRAWER_UNIT_CM);
  }
  return null; // this category has no drawer zone at all
}

const DRAWER_CAPABLE_CATEGORIES = ["HANGING", "LONG_HANGING", "DRAWER"];
function resolveDrawerHeights(space, idx, category) {
  if (!DRAWER_CAPABLE_CATEGORIES.includes(category)) return null;
  const override = space.drawerOverrides && space.drawerOverrides[idx];
  if (override) return override;
  return autoDrawerHeights(category, realInteriorCm(category)) || [];
}

// 拉籃 (pull-out wire baskets) — same idea as the drawer stack, but never auto-added: they only
// appear once the user adds one, stacked below the drawers.
const BASKET_PRESETS_CM = [15, 20, 25];
function nextBasketHeight(h) {
  const idx = BASKET_PRESETS_CM.indexOf(h);
  return BASKET_PRESETS_CM[(idx + 1) % BASKET_PRESETS_CM.length];
}
function resolveBasketHeights(space, idx, category) {
  if (!DRAWER_CAPABLE_CATEGORIES.includes(category)) return null;
  return (space.basketOverrides && space.basketOverrides[idx]) || [];
}

/* ---------------------------------------------------------------
   DXF export (AutoCAD-compatible, plain ASCII DXF R12) — every
   coordinate is real cm, drawn full scale, with dimension lines
   and text labels for widths/heights so it opens straight into AutoCAD.
----------------------------------------------------------------*/
const PANEL_T = 1.8; // cm — board thickness (matches the catalog's 18mm panel spec), drawn as a real double line
const FRONT_REVEAL = 0.3; // cm gap shown between adjacent drawer/door fronts and the carcass

function buildSpaceDxfEntities(space, calc) {
  const L = []; // { type: 'LINE'|'TEXT', ...fields }
  const line = (x1, y1, x2, y2) => L.push({ type: "LINE", x1, y1, x2, y2 });
  const text = (x, y, h, str) => L.push({ type: "TEXT", x, y, h, str });
  // a board drawn as an actual PANEL_T-thick rectangle, not a single centerline
  const hBoard = (x0, x1, yTop) => { const yb = yTop - PANEL_T; line(x0, yb, x1, yb); line(x0, yTop, x1, yTop); line(x0, yb, x0, yTop); line(x1, yb, x1, yTop); };
  const vBoard = (x0, y0, y1, thickness) => { const x1 = x0 + thickness; line(x0, y0, x0, y1); line(x1, y0, x1, y1); line(x0, y0, x1, y0); line(x0, y1, x1, y1); };
  const drawerFront = (x0, x1, yBottom, yTop) => {
    const fx0 = x0 + FRONT_REVEAL, fx1 = x1 - FRONT_REVEAL, fy0 = yBottom + FRONT_REVEAL, fy1 = yTop - FRONT_REVEAL;
    line(fx0, fy0, fx1, fy0); line(fx1, fy0, fx1, fy1); line(fx1, fy1, fx0, fy1); line(fx0, fy1, fx0, fy0);
    // handle/pull — small recessed bar near the top edge of the drawer front
    const hw = Math.min((fx1 - fx0) * 0.22, 6);
    const hcx = (fx0 + fx1) / 2;
    const hy = Math.min(fy1 - 1.2, fy0 + (fy1 - fy0) - 1.2);
    line(hcx - hw / 2, hy, hcx + hw / 2, hy);
    line(hcx - hw / 2, hy - 0.5, hcx + hw / 2, hy - 0.5);
  };
  // a hanger + garment silhouette, drawn from a rod at rodY hanging DOWN by `height`
  const garmentIcon = (cx, rodY, height) => {
    const shoulder = Math.max(4, height * 0.45);
    const shoulderY = rodY - 2;
    line(cx, rodY, cx, shoulderY);
    line(cx - shoulder / 2, shoulderY - 1.2, cx, shoulderY);
    line(cx, shoulderY, cx + shoulder / 2, shoulderY - 1.2);
    const hemY = shoulderY - 1.2 - height;
    line(cx - shoulder / 2, shoulderY - 1.2, cx - shoulder / 2.5, hemY);
    line(cx - shoulder / 2.5, hemY, cx + shoulder / 2.5, hemY);
    line(cx + shoulder / 2.5, hemY, cx + shoulder / 2, shoulderY - 1.2);
  };
  // a hanging rod with evenly-spaced garments below it, filling [x0..x1] x [yBottom..yTop]
  const hangZoneIcons = (x0, x1, yBottom, yTop, long) => {
    const rodY = yTop - 3;
    line(x0 + 1, rodY, x1 - 1, rodY);
    const span = x1 - x0;
    const count = Math.max(2, Math.round(span / 22));
    const garmentH = long ? Math.max(4, rodY - yBottom - 3) : Math.min(60, (rodY - yBottom) * 0.62);
    for (let k = 0; k < count; k++) garmentIcon(x0 + (span / (count + 1)) * (k + 1), rodY, garmentH);
  };
  // a small folded-clothes box sitting on a shelf, centered at cx with its base at yBase
  const boxIcon = (cx, yBase, boxW, boxH) => {
    line(cx - boxW / 2, yBase, cx + boxW / 2, yBase);
    line(cx + boxW / 2, yBase, cx + boxW / 2, yBase + boxH);
    line(cx + boxW / 2, yBase + boxH, cx - boxW / 2, yBase + boxH);
    line(cx - boxW / 2, yBase + boxH, cx - boxW / 2, yBase);
    line(cx - boxW / 2, yBase + boxH * 0.55, cx + boxW / 2, yBase + boxH * 0.55);
  };
  // a small handbag silhouette for the display-cabinet shelves
  const bagIcon = (cx, yBase, bagW, bagH) => {
    line(cx - bagW / 2, yBase, cx + bagW / 2, yBase);
    line(cx + bagW / 2, yBase, cx + bagW / 2, yBase + bagH);
    line(cx + bagW / 2, yBase + bagH, cx - bagW / 2, yBase + bagH);
    line(cx - bagW / 2, yBase + bagH, cx - bagW / 2, yBase);
    line(cx - bagW * 0.28, yBase + bagH, cx - bagW * 0.28, yBase + bagH + 1.5);
    line(cx - bagW * 0.28, yBase + bagH + 1.5, cx + bagW * 0.28, yBase + bagH + 1.5);
    line(cx + bagW * 0.28, yBase + bagH + 1.5, cx + bagW * 0.28, yBase + bagH);
  };
  // rows of shelf boxes across a shelving cavity split into `rows` bands between yBottom..yTop
  const shelfBoxIcons = (x0, x1, yBottom, yTop, rows, icon) => {
    const rowH = (yTop - yBottom) / rows;
    const w = Math.min((x1 - x0) * 0.28, 18);
    const h = rowH * 0.45;
    for (let r = 0; r < rows; r++) {
      const cx = x0 + (x1 - x0) * (r % 2 === 0 ? 0.3 : 0.62);
      const yBase = yBottom + rowH * r + rowH * 0.2;
      icon(cx, yBase, w, h);
    }
  };

  const H = 240;
  let cursorX = 0;

  calc.modules.forEach((m, i) => {
    const w = m.width;
    const x0 = cursorX, x1 = cursorX + w;
    const { valance, kick } = zoneCm(m.category);
    const valanceY = H - valance;

    // carcass: left/right side panels, top board, and the floor board (resting at kick height —
    // the open toe-kick recess below it is left blank, matching real construction)
    vBoard(x0, 0, H, PANEL_T);
    vBoard(x1 - PANEL_T, 0, H, PANEL_T);
    hBoard(x0, x1, H);
    hBoard(x0 + PANEL_T, x1 - PANEL_T, kick + PANEL_T);
    // top-box (valance) bottom board
    hBoard(x0 + PANEL_T, x1 - PANEL_T, valanceY);
    text(x0 + PANEL_T + 1, valanceY + valance / 2 - 2, 5, `頂箱 ${valance}`);
    text(x0 + PANEL_T + 1, kick / 2 - 1.5, 4, `踢腳 ${kick}`);

    const innerX0 = x0 + PANEL_T, innerX1 = x1 - PANEL_T;
    const interiorCm = H - valance - kick - PANEL_T; // minus the floor board we just drew
    const interiorBottom = kick + PANEL_T;
    const heights = resolveDrawerHeights(space, i, m.category);

    if (heights !== null) {
      const drawerSum = heights.reduce((s, v) => s + v, 0);
      const drawerTopY = interiorBottom + drawerSum;
      if (drawerSum > 0) {
        hBoard(innerX0, innerX1, drawerTopY);
        let y = interiorBottom;
        heights.forEach((h) => {
          if (y > interiorBottom) hBoard(innerX0, innerX1, y);
          drawerFront(innerX0, innerX1, y, y + h - PANEL_T);
          text(innerX1 - 10, y + h / 2 - 2, 5, `${h}`);
          y += h;
        });
      }
      if (interiorCm - drawerSum > 4) {
        hangZoneIcons(innerX0, innerX1, drawerTopY, valanceY, m.category === "LONG_HANGING");
      }
    } else if (m.category === "SHELF") {
      const rows = Math.max(1, Math.round(interiorCm / SHELF_UNIT_CM));
      const rowH = interiorCm / rows;
      for (let r = 1; r < rows; r++) hBoard(innerX0, innerX1, interiorBottom + rowH * r);
      shelfBoxIcons(innerX0, innerX1, interiorBottom, valanceY, rows, boxIcon);
    } else if (m.category === "DOUBLE_HANGING") {
      const midY = interiorBottom + interiorCm / 2;
      hBoard(innerX0, innerX1, midY);
      hangZoneIcons(innerX0, innerX1, interiorBottom, midY, false);
      hangZoneIcons(innerX0, innerX1, midY, valanceY, false);
    } else if (m.category === "DISPLAY") {
      const rows = Math.max(2, Math.round(interiorCm / SHELF_UNIT_CM));
      const rowH = interiorCm / rows;
      for (let r = 1; r < rows; r++) hBoard(innerX0, innerX1, interiorBottom + rowH * r);
      shelfBoxIcons(innerX0, innerX1, interiorBottom, valanceY, rows, bagIcon);
    }

    text(x0 + w / 2 - Math.min(w * 0.3, 10), -14, 6, `${CATEGORY_META[m.category].label} ${w}`);
    cursorX = x1;
  });

  if (calc.built.filler > 0) {
    const x0 = cursorX, x1 = cursorX + calc.built.filler;
    vBoard(x0, 0, H, PANEL_T); vBoard(x1 - PANEL_T, 0, H, PANEL_T); hBoard(x0, x1, H); hBoard(x0, x1, PANEL_T);
    text(x0 + 1, -14, 5, `收邊 ${calc.built.filler}`);
    cursorX = x1;
  }

  const drawnTotal = cursorX;

  // overall width dimension (dumb dimension: line + end ticks + text)
  const dimY = -32;
  line(0, dimY, drawnTotal, dimY);
  line(0, dimY - 3, 0, dimY + 3);
  line(drawnTotal, dimY - 3, drawnTotal, dimY + 3);
  text(drawnTotal / 2 - 10, dimY - 9, 7, `${space.width}cm`);

  // overall height dimension
  const dimX = drawnTotal + 15;
  line(dimX, 0, dimX, H);
  line(dimX - 3, 0, dimX + 3, 0);
  line(dimX - 3, H, dimX + 3, H);
  text(dimX + 5, H / 2, 7, `${H}cm`);

  text(0, H + 20, 8, `${space.name || "衣櫃"}｜正立面圖（單位：cm，僅供參考，非生產排孔圖）`);
  text(0, H + 14, 5, `板材厚度 ${PANEL_T}cm（雙線表示實際厚度）`);
  text(0, H + 8, 5, `板材色號：${calc.color.code} ${calc.color.name}（${calc.color.grade}色）｜門片：${calc.door.name}`);

  return L;
}

// DXF R12 text is plain ASCII — non-ASCII characters (our Chinese labels) must be encoded as
// \U+XXXX unicode escapes per the DXF spec so AutoCAD renders them correctly regardless of
// the reading application's codepage, instead of relying on a specific file encoding.
function escapeDxfText(str) {
  return Array.from(str).map((ch) => {
    const code = ch.codePointAt(0);
    if (code < 128) return ch;
    return `\\U+${code.toString(16).toUpperCase().padStart(4, "0")}`;
  }).join("");
}

function entitiesToDxf(entities) {
  const out = [];
  out.push("0", "SECTION", "2", "HEADER", "9", "$ACADVER", "1", "AC1009", "0", "ENDSEC");
  out.push("0", "SECTION", "2", "ENTITIES");
  entities.forEach((e) => {
    if (e.type === "LINE") {
      out.push("0", "LINE", "8", "0",
        "10", e.x1.toFixed(2), "20", e.y1.toFixed(2), "30", "0",
        "11", e.x2.toFixed(2), "21", e.y2.toFixed(2), "31", "0");
    } else if (e.type === "TEXT") {
      out.push("0", "TEXT", "8", "0",
        "10", e.x.toFixed(2), "20", e.y.toFixed(2), "30", "0",
        "40", e.h.toFixed(2), "1", escapeDxfText(e.str));
    }
  });
  out.push("0", "ENDSEC", "0", "EOF");
  return out.join("\n");
}

function downloadTextFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportSpaceToDxf(space, calc) {
  const entities = buildSpaceDxfEntities(space, calc);
  const dxf = entitiesToDxf(entities);
  const safeName = (space.name || "衣櫃").replace(/[\\/:*?"<>|]/g, "");
  downloadTextFile(`${safeName}-立面圖.dxf`, dxf, "application/dxf");
}

// Web Share API (level 2, file sharing) lets the OS share sheet offer LINE directly when it's
// installed — this only works over https and on browsers that support sharing files, so it
// falls back to a plain download (with a heads-up) everywhere else.
async function shareSpaceDxf(space, calc) {
  const entities = buildSpaceDxfEntities(space, calc);
  const dxf = entitiesToDxf(entities);
  const safeName = (space.name || "衣櫃").replace(/[\\/:*?"<>|]/g, "");
  const filename = `${safeName}-立面圖.dxf`;
  try {
    const file = new File([dxf], filename, { type: "application/dxf" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename, text: `${space.name || "衣櫃"} 系統櫃立面圖` });
      return;
    }
  } catch (err) {
    if (err && err.name === "AbortError") return; // user cancelled the share sheet
  }
  downloadTextFile(filename, dxf, "application/dxf");
  alert("此瀏覽器不支援直接分享檔案給 LINE，已改為下載，請於下載完成後在 LINE 中手動選擇該檔案傳送。");
}

function drawInterior(category, x, y, w, h, color, scale, drawerHeightsCm, onDrawerClick, basketHeightsCm, onBasketClick) {
  const interiorCm = h / scale;

  switch (category) {
    case "HANGING":
    case "LONG_HANGING": {
      const drawerSumCm = (drawerHeightsCm || []).reduce((s, v) => s + v, 0);
      const basketSumCm = (basketHeightsCm || []).reduce((s, v) => s + v, 0);
      const hangCm = interiorCm - drawerSumCm - basketSumCm;
      const hangPx = hangCm * scale;
      const drawerPx = drawerSumCm * scale;
      return (
        <>
          {hangingContent(x, y, w, hangPx, category === "LONG_HANGING", color)}
          {drawerHeightsCm && drawerHeightsCm.length > 0 && (
            <>
              <line x1={x} y1={y + hangPx} x2={x + w} y2={y + hangPx} stroke={color} strokeWidth="0.8" opacity="0.5" />
              {drawerContent(x, y + hangPx, w, drawerHeightsCm, scale, color, onDrawerClick)}
            </>
          )}
          {basketHeightsCm && basketHeightsCm.length > 0 && (
            <>
              <line x1={x} y1={y + hangPx + drawerPx} x2={x + w} y2={y + hangPx + drawerPx} stroke={color} strokeWidth="0.8" opacity="0.5" />
              {basketContent(x, y + hangPx + drawerPx, w, basketHeightsCm, scale, color, onBasketClick)}
            </>
          )}
        </>
      );
    }
    case "DOUBLE_HANGING": return doubleHangingContent(x, y, w, h, color);
    case "SHELF": {
      const rows = Math.max(1, Math.round(interiorCm / SHELF_UNIT_CM));
      return shelfContent(x, y, w, h, color, false, rows);
    }
    case "DISPLAY": {
      const rows = Math.max(2, Math.round(interiorCm / SHELF_UNIT_CM));
      return displayContent(x, y, w, h, color, rows);
    }
    case "DRAWER": {
      const drawerSumCm = (drawerHeightsCm || []).reduce((s, v) => s + v, 0);
      const basketSumCm = (basketHeightsCm || []).reduce((s, v) => s + v, 0);
      const hangCm = interiorCm - drawerSumCm - basketSumCm;
      const hangPx = hangCm * scale;
      const drawerPx = drawerSumCm * scale;
      return (
        <>
          {hangPx > 12 && hangingContent(x, y, w, hangPx, false, color)}
          {hangPx > 12 && (
            <line x1={x} y1={y + hangPx} x2={x + w} y2={y + hangPx} stroke={color} strokeWidth="0.8" opacity="0.5" />
          )}
          {drawerContent(x, y + hangPx, w, drawerHeightsCm, scale, color, onDrawerClick)}
          {basketHeightsCm && basketHeightsCm.length > 0 && (
            <>
              <line x1={x} y1={y + hangPx + drawerPx} x2={x + w} y2={y + hangPx + drawerPx} stroke={color} strokeWidth="0.8" opacity="0.5" />
              {basketContent(x, y + hangPx + drawerPx, w, basketHeightsCm, scale, color, onBasketClick)}
            </>
          )}
        </>
      );
    }
    default: return null;
  }
}


function SpaceCard({ space, calc, expanded, onToggle, onUpdate, onRemove, removable }) {
  const { built, modules } = calc;
  const svgW = 680;
  const marginX = 18, rightPad = 70, marginTop = 18;
  const usableW = svgW - marginX - rightPad;
  const maxCabinetH = 190; // px cap for the tallest a 240cm cabinet will ever draw

  // single px-per-cm scale applied to BOTH axes, so the drawing is true to real proportions
  const scale = Math.min(usableW / space.width, maxCabinetH / 240);
  const cabinetH = scale * 240;
  const drawnWidth = scale * space.width;
  const originX = marginX + (usableW - drawnWidth) / 2; // center the (possibly narrower) run

  const captionY = marginTop + cabinetH + 16;
  const segDimY = captionY + 20;
  const totalDimY = segDimY + 28;
  const footerY = totalDimY + 22;
  const svgH = footerY + 14;

  let cursor = 0;

  const handleModuleClick = (idx) => {
    const m = modules[idx];
    const nextCat = nextValidCategory(m.category, m.width);
    const newDrawerOverrides = { ...space.drawerOverrides };
    delete newDrawerOverrides[idx];
    const newBasketOverrides = { ...space.basketOverrides };
    delete newBasketOverrides[idx];
    onUpdate({ overrides: { ...space.overrides, [idx]: nextCat }, drawerOverrides: newDrawerOverrides, basketOverrides: newBasketOverrides });
  };

  const getDrawerHeights = (idx, category) => resolveDrawerHeights(space, idx, category);
  const setDrawerHeights = (idx, newArr) => {
    onUpdate({ drawerOverrides: { ...space.drawerOverrides, [idx]: newArr } });
  };
  const cycleDrawer = (idx, pos, current) => {
    const arr = [...current];
    arr[pos] = nextDrawerHeight(arr[pos]);
    setDrawerHeights(idx, arr);
  };
  const addDrawer = (idx, current, category) => {
    const cap = realInteriorCm(category);
    const basketSum = (getBasketHeights(idx, category) || []).reduce((s, v) => s + v, 0);
    const sum = current.reduce((s, v) => s + v, 0);
    if (sum + basketSum + 15 > cap) return; // no room left in this module
    setDrawerHeights(idx, [...current, 15]);
  };
  const removeDrawer = (idx, current, category) => {
    const minCount = category === "DRAWER" ? 1 : 0;
    if (current.length <= minCount) return;
    setDrawerHeights(idx, current.slice(0, -1));
  };

  const getBasketHeights = (idx, category) => resolveBasketHeights(space, idx, category);
  const setBasketHeights = (idx, newArr) => {
    onUpdate({ basketOverrides: { ...space.basketOverrides, [idx]: newArr } });
  };
  const cycleBasket = (idx, pos, current) => {
    const arr = [...current];
    arr[pos] = nextBasketHeight(arr[pos]);
    setBasketHeights(idx, arr);
  };
  const addBasket = (idx, current, category) => {
    const cap = realInteriorCm(category);
    const drawerSum = (getDrawerHeights(idx, category) || []).reduce((s, v) => s + v, 0);
    const sum = current.reduce((s, v) => s + v, 0);
    if (sum + drawerSum + 15 > cap) return; // no room left in this module
    setBasketHeights(idx, [...current, 15]);
  };
  const removeBasket = (idx, current) => {
    if (current.length === 0) return;
    setBasketHeights(idx, current.slice(0, -1));
  };

  // boundaries (in px, relative to originX) of every segment, for the tick-marked dimension chain
  const boundaries = [0];
  let acc = 0;
  modules.forEach((m) => { acc += m.width; boundaries.push(acc); });
  if (built.filler > 0) { acc += built.filler; boundaries.push(acc); }

  const drawerEditRows = []; // collected while drawing the SVG below, rendered as controls after it

  return (
    <div style={{ background: "#fff", border: "1px solid #e4ddc8", borderRadius: 12, marginBottom: 16, overflow: "hidden" }}>
      <div
        onClick={onToggle}
        style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", cursor: "pointer", background: "#fbf9f3" }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
          <input
            value={space.name}
            onClick={(e) => e.stopPropagation()}
            onChange={(e) => onUpdate({ name: e.target.value })}
            placeholder="空間名稱，例如：主臥衣櫃"
            style={{ fontSize: 15, fontWeight: 700, border: "none", background: "transparent", color: NAVY, width: "100%", outline: "none" }}
          />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: "#5b6478" }}>${calc.subtotal.toLocaleString()}</span>
          {removable && (
            <button onClick={(e) => { e.stopPropagation(); onRemove(); }} style={{ border: "none", background: "none", color: "#b0453a", cursor: "pointer", padding: 4 }}>
              <Trash2 size={16} />
            </button>
          )}
          {expanded ? <ChevronUp size={18} color={NAVY} /> : <ChevronDown size={18} color={NAVY} />}
        </div>
      </div>

      {expanded && (
        <div style={{ padding: 16 }}>
          <Section icon={<Ruler size={16} />} title="尺寸">
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
              <NumberField label="寬度 cm" value={space.width} onChange={(v) => onUpdate({ width: v, overrides: {}, drawerOverrides: {}, basketOverrides: {} })} min={40} max={600} />
              <StaticField label="高度 cm" value={240} />
              <StaticField label="深度 cm" value={60} />
            </div>
          </Section>

          <Section icon={<Sparkles size={16} />} title="樣式">
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {TEMPLATES.map((t) => (
                <button key={t.id} onClick={() => onUpdate({ templateId: t.id, overrides: {}, drawerOverrides: {}, basketOverrides: {} })}
                  style={{ padding: "8px 14px", borderRadius: 8, border: space.templateId === t.id ? `2px solid ${NAVY}` : "1px solid #d8d2c2", background: space.templateId === t.id ? NAVY : "#fff", color: space.templateId === t.id ? "#fff" : NAVY, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                  {t.name}
                </button>
              ))}
            </div>
          </Section>

          <Section title="立面配置圖" trailing={
            <button onClick={() => onUpdate({ overrides: {}, drawerOverrides: {}, basketOverrides: {} })} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: "#5b6478", background: "none", border: "none", cursor: "pointer" }}>
              <RotateCcw size={12} /> 重設

          }>
            <svg width="100%" viewBox={`0 0 ${svgW} ${svgH}`} style={{ display: "block" }}>
              <rect x={0} y={0} width={svgW} height={svgH} fill="#fdfcf8" rx={10} />

              {modules.map((m, i) => {
                const x = originX + cursor * scale;
                const w = m.width * scale;
                cursor += m.width;
                const meta = CATEGORY_META[m.category];
                const { valance: valanceCm, kick: kickCm } = zoneCm(m.category);
                const valanceH = Math.min(cabinetH * 0.32, valanceCm * scale);
                const kickH = Math.min(cabinetH * 0.1, kickCm * scale);
                const interiorY = marginTop + valanceH + 3;
                const interiorH = cabinetH - valanceH - kickH - 5;
                const drawerHeights = getDrawerHeights(i, m.category);
                const basketHeights = getBasketHeights(i, m.category);
                if (drawerHeights) drawerEditRows.push({ idx: i, label: meta.label, heights: drawerHeights, basketHeights: basketHeights || [], category: m.category });
                return (
                  <g key={i} onClick={() => handleModuleClick(i)} style={{ cursor: "pointer" }}>
                    {/* cabinet carcass */}
                    <rect x={x} y={marginTop} width={w - 2} height={cabinetH} fill="#fff"
                      stroke={NAVY} strokeWidth={1.2} rx={2} />
                    {/* top valance box */}
                    <rect x={x + 4} y={marginTop + 3} width={Math.max(w - 10, 2)} height={Math.max(valanceH - 4, 2)} fill="#f2ede0" stroke={NAVY} strokeWidth="0.8" rx="1" />
                    {/* category interior illustration */}
                    {drawInterior(m.category, x + 3, interiorY, w - 8, interiorH, NAVY, scale, drawerHeights, drawerHeights ? (pos) => cycleDrawer(i, pos, drawerHeights) : null, basketHeights, basketHeights ? (pos) => cycleBasket(i, pos, basketHeights) : null)}
                    {/* kick base */}
                    <rect x={x} y={marginTop + cabinetH - kickH} width={w - 2} height={kickH} fill="#e9e3d2" />
                    {/* category label only (width now lives on the dimension line below) */}
                    <text x={x + w / 2} y={captionY} textAnchor="middle" fontSize={10.5} fontWeight={700} fill={NAVY}>{meta.label}</text>
                  </g>
                );
              })}

              {built.filler > 0 && (
                <rect x={originX + cursor * scale} y={marginTop} width={Math.max(built.filler * scale, 2)} height={cabinetH} fill="#e4ddc8" />
              )}

              {built.split && (
                <line x1={originX + built.split.leftTotal * scale} y1={marginTop - 6} x2={originX + built.split.leftTotal * scale} y2={marginTop + cabinetH + 6} stroke={GOLD} strokeWidth={2} strokeDasharray="6 4" />
              )}

              {/* segment dimension chain — tick marks at every module boundary, cm between them */}
              <g stroke="#8a8f9c" strokeWidth="1">
                <line x1={originX} y1={segDimY} x2={originX + drawnWidth} y2={segDimY} />
                {boundaries.map((b, i) => (
                  <line key={i} x1={originX + b * scale} y1={segDimY - 3} x2={originX + b * scale} y2={segDimY + 3} />
                ))}
              </g>
              {boundaries.slice(1).map((b, i) => {
                const prev = boundaries[i];
                const segCm = b - prev;
                const cx = originX + ((prev + b) / 2) * scale;
                if ((b - prev) * scale < 18) return null; // skip label if segment too narrow to fit text
                return (
                  <text key={i} x={cx} y={segDimY - 6} textAnchor="middle" fontSize={9} fill="#8a8f9c">{segCm}</text>
                );
              })}

              {/* total width dimension */}
              <g stroke={NAVY} strokeWidth="1.2">
                <line x1={originX} y1={totalDimY} x2={originX + drawnWidth} y2={totalDimY} />
                <line x1={originX} y1={totalDimY - 5} x2={originX} y2={totalDimY + 5} />
                <line x1={originX + drawnWidth} y1={totalDimY - 5} x2={originX + drawnWidth} y2={totalDimY + 5} />
              </g>
              <text x={originX + drawnWidth / 2} y={totalDimY - 8} textAnchor="middle" fontSize={12} fontWeight={700} fill={NAVY}>{space.width}cm</text>

              {/* vertical height dimension */}
              <g stroke="#5b6478" strokeWidth="1">
                <line x1={originX + drawnWidth + 22} y1={marginTop} x2={originX + drawnWidth + 22} y2={marginTop + cabinetH} />
                <line x1={originX + drawnWidth + 18} y1={marginTop} x2={originX + drawnWidth + 26} y2={marginTop} />
                <line x1={originX + drawnWidth + 18} y1={marginTop + cabinetH} x2={originX + drawnWidth + 26} y2={marginTop + cabinetH} />
              </g>
              <text x={originX + drawnWidth + 32} y={marginTop + cabinetH / 2 - 4} fontSize={11} fontWeight={700} fill="#5b6478">240</text>
              <text x={originX + drawnWidth + 32} y={marginTop + cabinetH / 2 + 9} fontSize={8.5} fill="#8a8f9c">(含踢腳)</text>

              <text x={svgW / 2} y={footerY} textAnchor="middle" fontSize={11} fill="#8a8f9c">正立面圖（依實際比例繪製）</text>
            </svg>
            <p style={{ fontSize: 12, color: "#8a8f9c", marginTop: 6 }}>點選櫃體背景可切換模組類型；點選抽屜面板可切換高度。CAD 下載請至「採購」頁籤。</p>

                      {row.heights.length === 0 && <span style={{ fontSize: 11, color: "#b0aa90" }}>（無）</span>}
                      <button onClick={() => addDrawer(row.idx, row.heights, row.category)}

                      <button onClick={() => removeDrawer(row.idx, row.heights, row.category)}
                        style={{ fontSize: 12, fontWeight: 700, width: 22, height: 22, borderRadius: 6, border: "1px solid #d8d2c2", background: "#f6f3ec", color: NAVY, cursor: "pointer" }}>－</button>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 6, paddingTop: 6, borderTop: "1px dashed #eee7d6" }}>
                      <span style={{ fontSize: 11, fontWeight: 700, color: "#5b6478" }}>拉籃：</span>
                      {row.basketHeights.map((h, pos) => (
                        <button key={pos} onClick={() => cycleBasket(row.idx, pos, row.basketHeights)}
                          style={{ fontSize: 11, fontWeight: 700, padding: "4px 8px", borderRadius: 6, border: `1px solid ${NAVY}`, background: "#fff", color: NAVY, cursor: "pointer" }}>
                          {h}cm
                        </button>

                      <button onClick={() => addBasket(row.idx, row.basketHeights, row.category)}

    </div>
